<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Order Detail | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <div class="container">
      <img src="../images/logo.png" alt="Renovo">
      <div style="display:flex; gap:24px; align-items:center;">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/schedule.html">Schedule</a>
        <a href="/admin/contracts.html">Contracts</a>
        <a href="/admin/work-orders.html">Work Orders</a>
        <a href="/admin/subcontractors.html">Subcontractors</a>
        <a href="/admin/documents.html">Documents</a>
        <a href="/admin/profitability.html">Profit</a>
        <a href="/admin/estimate-new.html">+ New Estimate</a>
        <a href="/admin/invoice-new.html">+ New Invoice</a>
        <button onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="admin-wrap" style="max-width:720px;">
    <a href="/admin/work-orders.html" style="color:var(--blue); font-size:0.9rem;">&larr; Back to Work Orders</a>
    <div id="content" style="margin-top:20px;">Loading…</div>
  </div>

<script src="../js/admin.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');

async function load() {
  const res = await adminFetch(`/api/admin/work-orders/${id}`);
  if (!res.ok) { document.getElementById('content').innerHTML = '<div class="empty-state">Work order not found.</div>'; return; }
  const { workOrder, estimate, client, lineItems, signature, invoice, invoices } = await res.json();

  const total = lineItems.reduce((sum, li) => sum + Number(li.quantity) * Number(li.unitPrice), 0);
  const itemsHtml = lineItems.map(li => `
    <tr><td>${li.description}</td><td>${li.quantity}</td><td>${money(li.unitPrice)}</td><td>${money(li.quantity * li.unitPrice)}</td></tr>
  `).join('');

  const woLink = `${window.location.origin}/work-order.html?t=${workOrder.token}`;

  let auditHtml = '';
  if (signature) {
    auditHtml = `
      <h3 style="margin:28px 0 12px;">Signature Audit Trail</h3>
      <table class="dash-table">
        <tbody>
          <tr><td style="font-weight:700; width:200px;">Signed By</td><td>${signature.signerName}</td></tr>
          <tr><td style="font-weight:700;">Signature Type</td><td>${signature.signatureType === 'drawn' ? 'Drawn' : 'Typed'}</td></tr>
          <tr><td style="font-weight:700;">Signed At</td><td>${new Date(signature.signedAt).toLocaleString()}</td></tr>
          <tr><td style="font-weight:700;">IP Address</td><td>${signature.ipAddress || '—'}</td></tr>
          <tr><td style="font-weight:700;">Electronic Signature Consent</td><td>${signature.consentConfirmed ? '✅ Confirmed' : '❌ Not confirmed'}</td></tr>
          <tr><td style="font-weight:700;">Terms &amp; Conditions Agreed</td><td>${signature.termsAgreed ? '✅ Confirmed' : '❌ Not confirmed'}</td></tr>
          <tr><td style="font-weight:700;">Terms Shown</td><td>${signature.serviceTypeShown || 'General'}</td></tr>
        </tbody>
      </table>
    `;
  } else {
    auditHtml = `<div class="empty-state" style="padding:24px;">Not signed yet.</div>`;
  }

  const done = !!workOrder.completedAt;
  const scheduleHtml = `
    <div class="wo-schedule">
      <div class="jp-eyebrow" style="margin-bottom:10px;">Scheduling</div>
      <div class="wo-schedule-row">
        <div class="field-group" style="margin:0;">
          <label for="schedDate">Service date</label>
          <input type="date" id="schedDate" value="${workOrder.scheduledDate || ''}">
        </div>
        <div class="field-group" style="margin:0;">
          <label for="schedStart">Start time</label>
          <input type="time" id="schedStart" value="${workOrder.scheduledStart || ''}">
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="schedSaveBtn" onclick="saveSchedule()">Save date</button>
      </div>
      <div class="wo-schedule-state">
        ${done
          ? `<span class="wo-done">Completed ${new Date(workOrder.completedAt).toLocaleDateString()}</span>
             <button type="button" class="btn btn-sm" style="color:#4A5A72;" onclick="setCompleted(false)">Reopen</button>`
          : workOrder.scheduledDate
            ? `<span style="color:#4A5A72; font-size:0.85rem;">Booked, not yet marked done.</span>
               <button type="button" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy);" onclick="setCompleted(true)">Mark completed</button>`
            : `<span style="color:#8A98AC; font-size:0.85rem;">No service date set — this job will not appear on the schedule.</span>`}
      </div>
      <p class="error-text" id="schedError"></p>
    </div>`;

  document.getElementById('content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
      <div>
        <h1 style="font-size:1.6rem;">Work Order #${workOrder.id}</h1>
        <p style="color:#8A98AC;">${client?.name || ''} &middot; ${client?.email || ''}</p>
      </div>
      ${statusPill(workOrder.status)}
    </div>

    ${scheduleHtml}

    <table class="dash-table">
      <thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
      <tbody>${itemsHtml}</tbody>
    </table>
    <div class="totals-row">Total: ${money(total)}</div>

    <h3 style="margin:28px 0 12px;">Work Authorization Text</h3>
    <div class="doc-terms">${workOrder.termsText}</div>

    ${auditHtml}

    <h3 style="margin:28px 0 6px;">Time On Job</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:620px;">
      Total crew hours, all technicians added together &mdash; three techs for four hours is twelve.
      This is the only real measurement in the system: without it the profitability report can only
      grade its own estimates, and a production rate that is wrong stays wrong.
    </p>
    <div id="actuals"></div>

    <h3 style="margin:28px 0 6px;">Crew Link</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:620px;">
      What the crew opens on their phone: the address, the scope, the mix and dwell times, the PPE,
      and the hours box above. No login &mdash; a password in a car park is how hours stop getting
      logged. No money on it either, and it is a different link from the client's, so a client who
      edits their own URL still cannot reach the job plan.
    </p>
    <div id="crewLink"></div>

    <h3 style="margin:28px 0 12px;">Job Photos</h3>
    <div id="beforePhotos"></div>
    <div id="afterPhotos"></div>

    <div id="jobPlan" style="margin-top:28px;">Loading job plan…</div>

    <div id="changeOrders" style="margin-top:28px;">Loading change orders…</div>

    ${invoiceLinks(invoices || (invoice ? [invoice] : []), estimate)}

    <h3 style="margin:28px 0 6px;">What the client sees</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px;">
      Preview opens the work order exactly as they will read it, with their signing controls disabled
      so a look cannot sign on their behalf. Worth checking before you send: the job plan and the crew
      notes are yours, and should not appear here.
    </p>
    <p>
      <a href="${woLink}&preview=1" target="_blank" class="btn btn-primary btn-sm" style="text-decoration:none;">Preview as the client</a>
    </p>
    <p style="margin-top:24px; font-size:0.85rem; word-break:break-all;"><strong>Client link:</strong> <a href="${woLink}" target="_blank">${woLink}</a></p>
  `;

  // The change order form names this so "leave blank" says what it inherits.
  window.__jobPo = estimate?.poNumber || null;
  loadPhotos();
  loadChangeOrders();
  // Estimated crew hours come from the lines Renovo works itself: a
  // subcontracted line consumed the sub's time, not ours, so counting it
  // here would make every subbed job look wildly under estimate.
  const estimatedHours = lineItems
    .filter(li => !li.isOptional && !li.subcontracted)
    .reduce((t, li) => t + (Number(li.estimatedDurationHours) || 0), 0);
  renderCrewLink(workOrder.crewToken);
  renderActuals({
    actualHours: workOrder.actualHours,
    actualCrewSize: workOrder.actualCrewSize,
    actualHoursNote: workOrder.actualHoursNote,
    estimatedHours: Math.round(estimatedHours * 100) / 100,
    estimatedMaterials: Math.round(lineItems
      .filter(li => !li.isOptional && !li.subcontracted)
      .reduce((t, li) => t + (Number(li.estimatedProductCost) || 0), 0) * 100) / 100,
  });
  loadJobPlan();
}

/* ---------- Scheduling ---------- */

async function patchWorkOrder(body, btn) {
  const err = document.getElementById('schedError');
  err.classList.remove('show');
  const label = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const res = await adminFetch(`/api/admin/work-orders/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Could not save.');
    }
    load();
  } catch (e) {
    err.textContent = e.message;
    err.classList.add('show');
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

function saveSchedule() {
  // Empty date clears the booking; the server drops any orphaned start time.
  patchWorkOrder({
    scheduledDate: document.getElementById('schedDate').value || null,
    scheduledStart: document.getElementById('schedStart').value || null,
  }, document.getElementById('schedSaveBtn'));
}

function setCompleted(completed) {
  patchWorkOrder({ completed }, null);
}

/* ---------- Job Plan (internal crew pack) ---------- */

async function loadJobPlan() {
  const res = await adminFetch(`/api/admin/work-orders/${id}/job-plan`);
  const target = document.getElementById('jobPlan');
  if (!res.ok) { target.innerHTML = '<div class="empty-state" style="padding:20px;">Could not build a job plan for this work order.</div>'; return; }
  const { plan } = await res.json();
  target.innerHTML = renderJobPlan(plan);
}

function planBand(eyebrow, body) {
  return `<div class="jp-band"><div class="jp-eyebrow">${eyebrow}</div>${body}</div>`;
}

function planSpec(label, value, unit, note) {
  return `<div>
    <div class="jp-spec-label">${label}</div>
    <div class="jp-spec-value">${value}${unit ? ` <span class="jp-spec-unit">${unit}</span>` : ''}</div>
    ${note ? `<div class="jp-spec-note">${note}</div>` : ''}
  </div>`;
}

function renderJobPlan(plan) {
  if (!plan.services.length) {
    return `<div class="empty-state" style="padding:20px;">Nothing to plan yet. Price this job through the estimate calculator and the crew plan builds itself — hand-typed line items carry no job details to work from.</div>`;
  }

  // Read-this-first band. Anything that changes how the day is scheduled or
  // what it costs belongs at the top, above the numbers. This is the one screen
  // that sees both sets: the crew's warnings and the ones about margin, which
  // are kept apart so the crew link cannot carry them.
  const allWarnings = plan.warnings.concat(plan.internalWarnings || []);
  const flags = allWarnings.length
    ? `<div class="jp-band jp-flags">${allWarnings.map(w => `<div class="jp-flag">${w}</div>`).join('')}</div>`
    : '';

  const specs = planBand('Dispatch', `<div class="jp-spec">
    ${planSpec('Crew', plan.crew.techs, `tech${plan.crew.techs === 1 ? '' : 's'}`, `${plan.crew.hoursEach} hrs each · ${plan.laborHours} labor hrs total`)}
    ${planSpec('On site', plan.onSiteHours, 'hrs', 'Door to door, including dwell')}
    ${planSpec('Water', plan.water.gallons.toLocaleString(), 'gal', plan.water.note)}
  </div>
  <div class="jp-spec-note jp-rationale">${plan.crew.rationale}</div>`);

  // Compliance first among the detail bands: it is the only part of this ticket
  // where getting it wrong costs a fine or an injury rather than an hour.
  const compliance = plan.compliance.length ? planBand('Before water hits the ground', plan.compliance.map(c => {
    if (c.level !== 'critical') {
      return `<div class="jp-note"><div class="jp-note-title">${c.requirement}</div><div class="jp-note-detail">${c.detail}</div></div>`;
    }
    // Absolute prohibitions get the red stripe; other criticals get amber.
    const isStop = /no storm drain|no exceptions/i.test(c.requirement);
    return `<div class="jp-hazard${isStop ? ' is-stop' : ''}">
      <div class="jp-hazard-title">${c.requirement}</div>
      <div class="jp-hazard-detail">${c.detail}</div>
    </div>`;
  }).join('')) : '';

  // Numbered because these genuinely run in order -- you cannot rinse before
  // the chemical dwells. The numbers carry information, they are not decoration.
  const sequence = planBand('Sequence', `<ol class="jp-seq">
    ${plan.phases.map((p, i) => `<li class="jp-seq-item">
      <span class="jp-seq-num">${String(i + 1).padStart(2, '0')}</span>
      <span class="jp-seq-label">${p.label}</span>
      <span class="jp-seq-dur">${p.minutes} min</span>
    </li>`).join('')}
  </ol>`);

  const load = plan.chemicals.length ? planBand('Load list', `<div class="jp-scroll"><table class="jp-load">
    <thead><tr><th>Product</th><th>Mix at</th><th>Take</th><th>Dwell</th></tr></thead>
    <tbody>${plan.chemicals.map(c => `<tr>
      <td>
        <strong>${c.product}</strong>
        <div class="jp-load-purpose">${c.purpose}</div>
        ${c.caution ? `<div class="jp-load-purpose is-caution">${c.caution}</div>` : ''}
      </td>
      <td>${c.dilution}</td>
      <td class="jp-qty">${c.concentrateGallons} gal${
        // Ready-to-use products aren't diluted, so "makes N gal" would just
        // restate the purchase figure. Only show it on a real dilution.
        c.mixedGallons > c.concentrateGallons * 1.1
          ? `<span class="jp-qty-sub">makes ${c.mixedGallons} gal</span>` : ''
      }</td>
      <td class="jp-qty">${c.dwellMinutes ? c.dwellMinutes + ' min' : '—'}</td>
    </tr>`).join('')}</tbody>
  </table></div>`) : '';

  const ledger = planBand('Materials against the quote', `<div class="jp-ledger">
    <div class="jp-ledger-line">Plan needs <strong>${money(plan.costCheck.plannedChemicalCost)}</strong> in chemicals; the estimate priced <strong>${money(plan.costCheck.quotedProductCost)}</strong>.</div>
    <div class="jp-ledger-verdict${plan.costCheck.status === 'over' ? ' is-over' : ''}">${
      plan.costCheck.status === 'over' ? `${money(plan.costCheck.delta)} over` : 'Covered'
    }</div>
  </div>`);

  const jpList = items => `<ul class="jp-list">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
  const kit = (plan.equipment.length || plan.ppe.length) ? planBand('Kit', `<div class="jp-cols">
    ${plan.equipment.length ? `<div><div class="jp-spec-label">Equipment</div>${jpList(plan.equipment)}</div>` : ''}
    ${plan.ppe.length ? `<div><div class="jp-spec-label">PPE</div>${jpList(plan.ppe)}</div>` : ''}
  </div>`) : '';

  // "Weather window" rather than "Call it off if" -- some of these are hard
  // stops and some are handling notes, and a label should not promise one
  // thing and deliver the other.
  const conditions = plan.weather.length ? planBand('Weather window', jpList(plan.weather)) : '';

  return `<div class="jp">
    <div class="jp-head">
      <span class="jp-head-title">Job Plan</span>
      <span class="jp-head-services">${plan.services.join(' · ')}</span>
      <span class="jp-tag">INTERNAL · NOT SENT TO CLIENT</span>
    </div>
    ${flags}
    ${specs}
    ${compliance}
    ${sequence}
    ${load}
    ${ledger}
    ${kit}
    ${conditions}
    <div class="jp-actions">
      <button type="button" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy);" onclick="window.print()">Print crew pack</button>
    </div>
  </div>`;
}

// resizeImageFile lives in admin.js -- work orders and estimates both need it.

function triggerUpload(category) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const dataUrl = await resizeImageFile(file);
      const res = await adminFetch(`/api/admin/work-orders/${id}/photos`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category, dataUrl })
      });
      if (res.ok) { loadPhotos(); } else { adminToast('Failed to upload photo.'); }
    } catch (err) {
      adminToast('Could not process that image.');
    }
  };
  input.click();
}

async function deletePhoto(photoId) {
  if (!(await adminConfirm('Delete this photo?', 'Delete'))) return;
  const res = await adminFetch(`/api/admin/work-orders/${id}/photos/${photoId}`, { method: 'DELETE' });
  if (res.ok) loadPhotos(); else adminToast('Failed to delete photo.');
}

function renderPhotoGrid(category, label, photos) {
  const items = photos.filter(p => p.category === category);
  const thumbs = items.map(p => `
    <div style="position:relative;">
      <img src="/api/photos/${p.token}" class="photo-thumb" alt="${label} photo">
      <button type="button" onclick="deletePhoto(${p.id})" style="position:absolute; top:4px; right:4px; background:rgba(13,31,56,0.75); color:#fff; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:0.8rem; line-height:1;">✕</button>
    </div>
  `).join('');
  return `
    <h4 style="margin:16px 0 8px; font-size:0.9rem; color:#4A5A72;">${label} Photos</h4>
    <div class="photo-grid">${thumbs}</div>
    <button type="button" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy); margin-top:8px;" onclick="triggerUpload('${category}')">+ Upload ${label} Photo</button>
  `;
}

async function loadPhotos() {
  const res = await adminFetch(`/api/admin/work-orders/${id}/photos`);
  if (!res.ok) return;
  const { photos } = await res.json();
  document.getElementById('beforePhotos').innerHTML = renderPhotoGrid('before', 'Before', photos);
  document.getElementById('afterPhotos').innerHTML = renderPhotoGrid('after', 'After', photos);
}

load();

/* ---------- Time on job ---------- */
let actualsState = { actualHours: null, actualCrewSize: null, actualMaterialsCost: null, actualHoursNote: null, estimatedHours: null, estimatedMaterials: null };

const KIND_LABEL = { full: 'Invoice', deposit: 'Deposit invoice', balance: 'Balance invoice' };

/*
 * A project with a deposit bills twice, so this lists what has gone out and
 * offers whichever half is still missing. Showing only the first invoice
 * would hide a balance nobody had raised.
 */
function invoiceLinks(list, estimate) {
  const pct = Number(estimate && estimate.depositPct);
  const split = Number.isFinite(pct) && pct > 0;
  const kinds = list.map(i => i.kind || 'full');

  const sent = list.map(i => `
    <p style="margin-top:10px;">
      <a href="/admin/invoice-detail.html?id=${i.id}" class="btn btn-primary btn-sm">
        View ${KIND_LABEL[i.kind || 'full']}
      </a>
      <span style="margin-left:10px; color:#8A98AC; font-size:0.85rem;">${statusPill(i.status)}</span>
    </p>`).join('');

  let next = '';
  if (split && !kinds.includes('deposit')) {
    next = `<p style="margin-top:12px;"><a href="/admin/invoice-new.html?workOrderId=${id}" class="btn btn-primary btn-sm">Create Deposit Invoice</a></p>`;
  } else if (split && !kinds.includes('balance')) {
    next = `<p style="margin-top:12px;"><a href="/admin/invoice-new.html?workOrderId=${id}" class="btn btn-primary btn-sm">Create Balance Invoice</a></p>`;
  }

  return sent + next;
}

function renderActuals(state) {
  if (state) actualsState = Object.assign(actualsState, state);
  const box = document.getElementById('actuals');
  if (!box) return;
  const a = actualsState;
  const est = a.estimatedHours;
  const logged = a.actualHours != null && Number(a.actualHours) > 0;

  let variance = '';
  if (logged && est > 0) {
    const ratio = Number(a.actualHours) / est;
    const over = ratio > 1.05;
    const under = ratio < 0.95;
    const color = over ? '#C0392B' : under ? '#1B7A3C' : '#4A5A72';
    const word = over ? 'over' : under ? 'under' : 'on';
    variance = '<p style="margin-top:10px; font-size:0.85rem; color:' + color + ';">'
      + 'Quoted ' + est.toFixed(1) + ' hrs, took ' + Number(a.actualHours).toFixed(1) + ' hrs \u2014 '
      + '<strong>' + Math.abs(Math.round((ratio - 1) * 100)) + '% ' + word + ' estimate</strong>.'
      + (over ? ' The profitability report is now costing this job at the real figure.' : '')
      + '</p>';
  }

  box.innerHTML = ''
    + '<div style="display:grid; grid-template-columns:140px 110px 140px 1fr; gap:0 14px; max-width:760px; align-items:end;">'
    +   '<div class="field-group" style="margin-bottom:8px;"><label>Total crew hours</label>'
    +     '<input type="number" id="actualHours" min="0" step="0.25" value="' + (a.actualHours != null ? a.actualHours : '') + '" placeholder="' + (est > 0 ? est.toFixed(1) : '0') + '"></div>'
    +   '<div class="field-group" style="margin-bottom:8px;"><label>Crew size</label>'
    +     '<input type="number" id="actualCrewSize" min="1" step="1" value="' + (a.actualCrewSize != null ? a.actualCrewSize : '') + '" placeholder="optional"></div>'
    +   '<div class="field-group" style="margin-bottom:8px;"><label>Chemicals spent ($)</label>'
    +     '<input type="number" id="actualMaterialsCost" min="0" step="1" value="' + (a.actualMaterialsCost != null ? a.actualMaterialsCost : '') + '" placeholder="' + (a.estimatedMaterials > 0 ? a.estimatedMaterials.toFixed(0) : '0') + '"></div>'
    +   '<div class="field-group" style="margin-bottom:8px;"><label>Note</label>'
    +     '<input type="text" id="actualHoursNote" value="' + escAttr(a.actualHoursNote || '') + '" placeholder="e.g. lift arrived two hours late"></div>'
    + '</div>'
    + '<button type="button" class="btn btn-primary btn-sm" onclick="saveActuals()">' + (logged ? 'Update' : 'Log') + ' time on job</button>'
    + (logged ? ' <button type="button" class="btn btn-sm" style="color:#C0392B;" onclick="clearActuals()">Clear</button>' : '')
    + variance;
}

function escAttr(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

async function saveActuals() {
  const body = {
    actualHours: document.getElementById('actualHours').value,
    actualCrewSize: document.getElementById('actualCrewSize').value,
    actualMaterialsCost: document.getElementById('actualMaterialsCost').value,
    note: document.getElementById('actualHoursNote').value,
  };
  const res = await adminFetch('/api/admin/work-orders/' + id + '/actuals', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { adminToast(data.error || 'Could not save the hours.'); return; }
  renderActuals({ actualHours: data.actualHours, actualCrewSize: data.actualCrewSize, actualMaterialsCost: data.actualMaterialsCost, actualHoursNote: data.actualHoursNote });
  adminToast('Time on job saved.', 'success');
}

async function clearActuals() {
  const res = await adminFetch('/api/admin/work-orders/' + id + '/actuals', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ actualHours: null }),
  });
  if (!res.ok) { adminToast('Could not clear the hours.'); return; }
  renderActuals({ actualHours: null, actualCrewSize: null, actualMaterialsCost: null, actualHoursNote: null });
}

/* ---------- Crew link ----------
 *
 * Issued on the first ask rather than with every work order: most jobs never
 * need one, and a token that exists is a token that can leak. Once issued it
 * does not change, so the link already sitting on somebody's phone keeps
 * working when this page is opened again.
 *
 * Built from the current origin rather than the URL the API returns, so the
 * link opens the site you are actually looking at.
 */
let crewUrl = null;

function renderCrewLink(token) {
  const box = document.getElementById('crewLink');
  if (!box) return;
  if (!token) {
    crewUrl = null;
    box.innerHTML = '<button type="button" class="btn btn-sm" onclick="makeCrewLink(this)">Create the crew link</button>';
    return;
  }
  crewUrl = window.location.origin + '/crew.html?t=' + token;
  box.innerHTML = '<p style="font-size:0.85rem; word-break:break-all; margin-bottom:8px;">'
    + '<a href="' + escAttr(crewUrl) + '" target="_blank">' + escAttr(crewUrl) + '</a></p>'
    + '<button type="button" class="btn btn-sm" id="copyCrewBtn" onclick="copyCrewLink()">Copy link</button>';
}

async function makeCrewLink(btn) {
  btn.disabled = true;
  const res = await adminFetch('/api/admin/work-orders/' + id + '/crew-link', { method: 'POST' });
  const data = await res.json().catch(() => ({}));
  btn.disabled = false;
  if (!res.ok) { adminToast(data.error || 'Could not create the crew link.'); return; }
  renderCrewLink(data.crewToken);
  adminToast('Crew link ready. Text it to whoever is running the job.', 'success');
}

async function copyCrewLink() {
  const btn = document.getElementById('copyCrewBtn');
  try {
    await navigator.clipboard.writeText(crewUrl);
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy link'; }, 1500);
  } catch {
    // Clipboard access needs a secure context and can be refused outright.
    adminToast('Copy did not work here — select the link above and copy it by hand.');
  }
}

/* ---------- Change orders ----------
 *
 * Scope moves on almost every job past a couple of hours. Without a document
 * for it the only options are to absorb the cost or to put a line on the final
 * invoice the client never agreed to, and the second is where disputes start.
 *
 * Drafted here, sent deliberately, and billed only once signed.
 */
let changeOrderLines = [{ description: '', quantity: 1, unitPrice: '' }];

const CHANGE_REASONS = [
  ['condition_found', 'Condition found on site'],
  ['client_request', 'Client requested additional work'],
  ['access', 'Access or scheduling restriction'],
  ['scope_clarification', 'Scope clarification'],
  ['quantity_correction', 'Measured quantity differs from estimate'],
  ['reduction', 'Scope removed at client request'],
];

const coStatusPill = (status) => {
  const map = {
    draft: ['Draft', '#8A98AC'],
    sent: ['Awaiting client', '#B7791F'],
    approved: ['Approved', '#1B7A3C'],
    declined: ['Declined', '#C0392B'],
  };
  const [label, color] = map[status] || [status, '#8A98AC'];
  return `<span style="font-size:0.75rem; font-weight:700; color:${color};">${label}</span>`;
};

async function loadChangeOrders() {
  const res = await adminFetch(`/api/admin/work-orders/${id}/change-orders`);
  if (!res.ok) {
    document.getElementById('changeOrders').innerHTML =
      '<p style="color:#C0392B; font-size:0.85rem;">Could not load change orders.</p>';
    return;
  }
  const { changeOrders } = await res.json();
  renderChangeOrders(changeOrders);
}

function renderChangeOrders(cos) {
  const approved = cos.filter(c => c.status === 'approved');
  const approvedTotal = approved.reduce((s, c) => s + Number(c.total), 0);

  const rows = cos.map(co => `
    <tr>
      <td style="font-weight:700;">${co.number}</td>
      <td>${escAttr(co.description).slice(0, 80)}${co.description.length > 80 ? '…' : ''}</td>
      <td style="text-align:right; white-space:nowrap;">${money(co.total)}</td>
      <td>${coStatusPill(co.status)}${co.status === 'approved' && !co.poNumber && window.__jobPo
        ? '<br><span style="font-size:0.72rem; color:#B7791F; font-weight:700;">no PO</span>' : ''}</td>
      <td style="text-align:right; white-space:nowrap;">
        <a href="/change-order.html?t=${co.token}&preview=1" target="_blank" style="font-size:0.82rem;">Preview</a>
        ${co.status === 'draft' ? `
          &middot; <a href="#" onclick="sendChangeOrder(${co.id}); return false;" style="font-size:0.82rem;">Send</a>
          &middot; <a href="#" onclick="deleteChangeOrder(${co.id}); return false;" style="font-size:0.82rem; color:#C0392B;">Delete</a>` : ''}
      </td>
    </tr>`).join('');

  document.getElementById('changeOrders').innerHTML = `
    <h3 style="margin:0 0 6px;">Change Orders</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:620px;">
      Scope that grew after the client signed. Only an approved change order is billed, and the
      invoice cites it by number so the client can see where the extra came from.
    </p>

    ${cos.length ? `
      <table class="dash-table">
        <thead><tr><th>Number</th><th>What changed</th><th style="text-align:right;">Amount</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${approved.length ? `<div class="totals-row">Approved changes: ${money(approvedTotal)}</div>` : ''}
      ${approved.some(c => !c.poNumber) && window.__jobPo ? `
        <p style="color:#B7791F; font-size:0.82rem; margin-top:8px; max-width:620px;">
          A change marked <strong>no PO</strong> was approved with the purchase order box cleared, so nothing
          says which PO covers it. The invoice will still quote the job's PO
          (<strong>${escAttr(window.__jobPo)}</strong>), but if that order has no headroom for the extra,
          accounts payable will reject the whole invoice. Worth a call before you send it.
        </p>` : ''}
    ` : '<p style="color:#8A98AC; font-size:0.85rem;">No change orders on this job.</p>'}

    <button type="button" class="btn btn-outline btn-sm" style="margin-top:12px; color:var(--navy); border-color:var(--navy);"
      onclick="toggleChangeOrderForm()">+ New change order</button>

    <div id="coForm" style="display:none; margin-top:16px; padding:18px; border:1.5px solid #DCE4EF; border-radius:12px; background:#F8FAFD;">
      <div class="field-group">
        <label for="coDescription">What changed</label>
        <textarea id="coDescription" rows="3" placeholder="The substrate under the vinyl needs a second strip pass before we can seal it."></textarea>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 16px;">
        <div class="field-group">
          <label for="coReason">Reason</label>
          <select id="coReason">
            <option value="">&mdash;</option>
            ${CHANGE_REASONS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <label for="coDays">Extra days needed</label>
          <input type="number" id="coDays" min="0" max="365" value="0">
        </div>
      </div>
      <div class="field-group">
        <label for="coPo">PO number for this change <span style="color:#8A98AC; font-weight:400;">(if they issue a separate one)</span></label>
        <input type="text" id="coPo" placeholder="${window.__jobPo ? 'Leave blank to use ' + window.__jobPo : 'Leave blank if the original PO covers it'}">
        ${window.__jobPo ? `<p style="color:#8A98AC; font-size:0.78rem; margin:6px 0 0;">
          This job is under PO <strong>${escAttr(window.__jobPo)}</strong>. Left blank, the client sees that
          number prefilled and can replace it if their AP issued a separate one.
        </p>` : ''}
      </div>

      <label style="display:block; font-size:0.82rem; font-weight:600; margin-bottom:6px; color:var(--navy);">Lines</label>
      <p style="color:#8A98AC; font-size:0.78rem; margin:0 0 8px;">
        A negative price removes scope and credits the client.
      </p>
      <div id="coLines"></div>
      <button type="button" class="btn btn-sm" style="color:var(--blue);" onclick="addChangeOrderLine()">+ Add line</button>

      <div class="totals-row" id="coTotal" style="margin-top:10px;">Total: $0.00</div>
      <p class="error-text" id="coError"></p>
      <div style="margin-top:10px;">
        <button type="button" class="btn btn-primary btn-sm" onclick="saveChangeOrder()">Save as draft</button>
        <button type="button" class="btn btn-sm" style="color:#8A98AC;" onclick="toggleChangeOrderForm()">Cancel</button>
      </div>
    </div>`;

  renderChangeOrderLines();
}

function toggleChangeOrderForm() {
  const el = document.getElementById('coForm');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function addChangeOrderLine() {
  changeOrderLines.push({ description: '', quantity: 1, unitPrice: '' });
  renderChangeOrderLines();
}

function removeChangeOrderLine(i) {
  changeOrderLines.splice(i, 1);
  if (!changeOrderLines.length) changeOrderLines = [{ description: '', quantity: 1, unitPrice: '' }];
  renderChangeOrderLines();
}

function updateChangeOrderLine(i, field, value) {
  changeOrderLines[i][field] = value;
  updateChangeOrderTotal();
}

function renderChangeOrderLines() {
  const host = document.getElementById('coLines');
  if (!host) return;
  host.innerHTML = changeOrderLines.map((l, i) => `
    <div style="display:grid; grid-template-columns:1fr 70px 110px 30px; gap:8px; margin-bottom:8px; align-items:center;">
      <input type="text" placeholder="Description" value="${escAttr(l.description)}"
        oninput="updateChangeOrderLine(${i}, 'description', this.value)">
      <input type="number" step="any" placeholder="Qty" value="${l.quantity}"
        oninput="updateChangeOrderLine(${i}, 'quantity', this.value)">
      <input type="number" step="any" placeholder="Price" value="${l.unitPrice}"
        oninput="updateChangeOrderLine(${i}, 'unitPrice', this.value)">
      <button type="button" style="background:none; border:none; color:#C0392B; cursor:pointer; font-size:1.1rem;"
        onclick="removeChangeOrderLine(${i})" title="Remove line">&times;</button>
    </div>`).join('');
  updateChangeOrderTotal();
}

function updateChangeOrderTotal() {
  const el = document.getElementById('coTotal');
  if (!el) return;
  const total = changeOrderLines.reduce(
    (s, l) => s + (Number(l.quantity) || 0) * (Number(l.unitPrice) || 0), 0);
  el.textContent = 'Total: ' + money(total);
}

function coError(msg) {
  const el = document.getElementById('coError');
  if (el) { el.textContent = msg; el.classList.add('show'); }
}

async function saveChangeOrder() {
  coError('');
  const payload = {
    description: document.getElementById('coDescription').value.trim(),
    reason: document.getElementById('coReason').value || undefined,
    poNumber: document.getElementById('coPo').value.trim() || undefined,
    scheduleImpactDays: Number(document.getElementById('coDays').value) || 0,
    lineItems: changeOrderLines
      .filter(l => l.description.trim())
      .map(l => ({ description: l.description.trim(), quantity: Number(l.quantity) || 0, unitPrice: Number(l.unitPrice) || 0 })),
  };

  const res = await adminFetch(`/api/admin/work-orders/${id}/change-orders`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) return coError(data.error || 'Could not save this change order.');

  changeOrderLines = [{ description: '', quantity: 1, unitPrice: '' }];
  loadChangeOrders();
}

async function sendChangeOrder(coId) {
  if (!confirm('Email this change order to the client for signature?')) return;
  const res = await adminFetch(`/api/admin/change-orders/${coId}?action=send`, { method: 'POST' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { alert(data.error || 'Could not send it.'); return; }
  if (!data.emailed) alert('Saved as sent, but the email did not go out. Send them the link yourself.');
  loadChangeOrders();
}

async function deleteChangeOrder(coId) {
  if (!confirm('Delete this draft change order?')) return;
  const res = await adminFetch(`/api/admin/change-orders/${coId}`, { method: 'DELETE' });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    alert(data.error || 'Could not delete it.');
    return;
  }
  loadChangeOrders();
}

</script>
</body>
</html>
