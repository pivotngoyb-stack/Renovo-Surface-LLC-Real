<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subcontractor Agreement Detail | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <div class="container">
      <img src="../images/logo.png" alt="Renovo">
      <div style="display:flex; gap:24px; align-items:center;">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/contracts.html">Contracts</a>
        <a href="/admin/work-orders.html">Work Orders</a>
        <a href="/admin/subcontractors.html">Subcontractors</a>
        <a href="/admin/documents.html">Documents</a>
        <a href="/admin/estimate-new.html">+ New Estimate</a>
        <a href="/admin/invoice-new.html">+ New Invoice</a>
        <button onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="admin-wrap" style="max-width:720px;">
    <a href="/admin/subcontractors.html" style="color:var(--blue); font-size:0.9rem;">&larr; Back to Subcontractors</a>
    <div id="content" style="margin-top:20px;">Loading…</div>
  </div>

<script src="../js/admin.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');

function paymentLabel(a) {
  return a.paymentType === 'flat' ? `${money(a.paymentAmount)}/job` : `${Number(a.paymentPercentage)}% of job revenue`;
}

async function load() {
  const res = await adminFetch(`/api/admin/subcontractors/${id}`);
  if (!res.ok) { document.getElementById('content').innerHTML = '<div class="empty-state">Agreement not found.</div>'; return; }
  const { agreement } = await res.json();

  const payRes = await adminFetch(`/api/admin/subcontractors/${id}/payments`);
  const { payments, totalPaid } = payRes.ok ? await payRes.json() : { payments: [], totalPaid: 0 };

  const link = `${window.location.origin}/subcontractor-agreement.html?t=${agreement.token}`;

  let auditHtml = '';
  if (agreement.status === 'signed') {
    auditHtml = `
      <h3 style="margin:28px 0 12px;">Signature Audit Trail</h3>
      <table class="dash-table">
        <tbody>
          <tr><td style="font-weight:700; width:200px;">Signed By</td><td>${agreement.signerName}</td></tr>
          <tr><td style="font-weight:700;">Signature Type</td><td>${agreement.signatureType === 'drawn' ? 'Drawn' : 'Typed'}</td></tr>
          <tr><td style="font-weight:700;">Signed At</td><td>${new Date(agreement.signedAt).toLocaleString()}</td></tr>
          <tr><td style="font-weight:700;">IP Address</td><td>${agreement.ipAddress || '—'}</td></tr>
          <tr><td style="font-weight:700;">Electronic Signature Consent</td><td>${agreement.consentConfirmed ? '✅ Confirmed' : '❌ Not confirmed'}</td></tr>
        </tbody>
      </table>
    `;
  } else {
    auditHtml = `<div class="empty-state" style="padding:24px;">Not signed yet.</div>`;
  }

  document.getElementById('content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
      <div>
        <h1 style="font-size:1.6rem;">${agreement.subcontractorName}</h1>
        <p style="color:#8A98AC;">${agreement.subcontractorPhone}${agreement.subcontractorEmail ? ' &middot; ' + agreement.subcontractorEmail : ''}</p>
      </div>
      <div style="text-align:right;">
        ${statusPill(agreement.status)}
        <div style="margin-top:10px;">
          <button class="btn btn-sm" style="color:${agreement.archived ? '#1B7A3C' : '#C0392B'};" onclick="archiveAgreement(${!agreement.archived})">${agreement.archived ? 'Unarchive' : 'Archive'}</button>
        </div>
      </div>
    </div>

    <table class="dash-table">
      <tbody>
        <tr><td style="font-weight:700; width:200px;">Payment Terms</td><td>${paymentLabel(agreement)}, within 24 hours of client payment</td></tr>
        <tr><td style="font-weight:700;">Created</td><td>${new Date(agreement.createdAt).toLocaleString()}</td></tr>
      </tbody>
    </table>

    ${auditHtml}

    <h3 style="margin:28px 0 12px;">Payments</h3>
    <p style="color:#4A5A72; margin-bottom:10px;">Total paid: <strong>${money(totalPaid)}</strong></p>
    ${payments.length ? `
      <table class="dash-table">
        <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Note</th><th></th></tr></thead>
        <tbody>${payments.map(p => `
          <tr>
            <td>${p.paidDate}</td>
            <td>${money(p.amount)}</td>
            <td style="text-transform:capitalize;">${p.method}</td>
            <td>${p.note || '—'}</td>
            <td><button class="btn btn-sm" style="color:#C0392B;" onclick="deletePayment(${p.id})">Delete</button></td>
          </tr>
        `).join('')}</tbody>
      </table>
    ` : '<div class="empty-state" style="padding:16px;">No payments recorded yet.</div>'}

    <div style="background:var(--off-white); border-radius:12px; padding:20px; margin-top:16px;">
      <div class="field-group"><label>Amount ($)</label><input type="number" id="payAmount" min="0.01" step="0.01"></div>
      <div class="field-group">
        <label>Method</label>
        <select id="payMethod">
          <option value="cash">Cash</option>
          <option value="check">Check</option>
          <option value="card">Card</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field-group"><label>Date Paid</label><input type="date" id="payDate" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field-group"><label>Note (optional)</label><input type="text" id="payNote"></div>
      <button class="btn btn-primary btn-sm" type="button" id="addPaymentBtn" onclick="addPayment()">Record Payment</button>
    </div>

    <p style="margin-top:24px; font-size:0.85rem; word-break:break-all;"><strong>Signing link:</strong> <a href="${link}" target="_blank">${link}</a></p>
  `;
}

async function addPayment() {
  const amount = Number(document.getElementById('payAmount').value);
  const method = document.getElementById('payMethod').value;
  const paidDate = document.getElementById('payDate').value;
  const note = document.getElementById('payNote').value;
  if (!amount || amount <= 0) { adminToast('Enter a valid payment amount.'); return; }

  const btn = document.getElementById('addPaymentBtn');
  btn.disabled = true;
  btn.textContent = 'Recording…';
  const res = await adminFetch(`/api/admin/subcontractors/${id}/payments`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount, method, paidDate, note })
  });
  if (res.ok) { load(); return; }
  adminToast('Failed to record payment.');
  btn.disabled = false;
  btn.textContent = 'Record Payment';
}

async function deletePayment(paymentId) {
  if (!(await adminConfirm('Delete this payment record?', 'Delete'))) return;
  const res = await adminFetch(`/api/admin/subcontractors/${id}/payments/${paymentId}`, { method: 'DELETE' });
  if (res.ok) load(); else adminToast('Failed to delete payment.');
}

async function archiveAgreement(archived) {
  const res = await adminFetch(`/api/admin/subcontractors/${id}/archive`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived })
  });
  if (res.ok) load(); else adminToast('Failed to update agreement.');
}

load();
</script>
</body>
</html>
