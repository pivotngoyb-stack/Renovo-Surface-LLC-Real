<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Detail | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <div class="container">
      <img src="../images/logo.png" alt="Renovo">
      <div style="display:flex; gap:24px; align-items:center;">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/schedule.html">Schedule</a>
        <a href="/admin/contracts.html">Contracts</a>
        <a href="/admin/work-orders.html">Work Orders</a>
        <a href="/admin/subcontractors.html">Subcontractors</a>
        <a href="/admin/documents.html">Documents</a>
        <a href="/admin/profitability.html">Profit</a>
        <a href="/admin/estimate-new.html">+ New Estimate</a>
        <a href="/admin/invoice-new.html">+ New Invoice</a>
        <button onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="admin-wrap" style="max-width:720px;">
    <a href="/admin/contracts.html" style="color:var(--blue); font-size:0.9rem;">&larr; Back to Contracts</a>
    <div id="content" style="margin-top:20px;">Loading…</div>
  </div>

<script src="../js/admin.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');

async function load() {
  const res = await adminFetch(`/api/admin/contracts/${id}`);
  if (!res.ok) { document.getElementById('content').innerHTML = '<div class="empty-state">Contract not found.</div>'; return; }
  const { contract, client, invoices } = await res.json();

  const autoPay = contract.autoChargeEnabled
    ? `✅ ${contract.cardBrand ? contract.cardBrand.toUpperCase() : 'Card'} ending in ${contract.cardLast4 || '••••'}`
    : 'Manual payment';

  let statusActions = '';
  if (contract.status === 'active') {
    statusActions = `<button class="btn btn-sm" style="color:#966A00;" onclick="setStatus('paused')">Pause</button> <button class="btn btn-sm" style="color:#C0392B;" onclick="setStatus('cancelled')">Cancel</button>`;
  } else if (contract.status === 'paused') {
    statusActions = `<button class="btn btn-sm" style="color:#1B7A3C;" onclick="setStatus('active')">Resume</button> <button class="btn btn-sm" style="color:#C0392B;" onclick="setStatus('cancelled')">Cancel</button>`;
  }

  const invoiceRows = invoices.map(inv => `
    <tr>
      <td><a href="/admin/invoice-detail.html?id=${inv.id}">INV-${1000 + inv.id}</a></td>
      <td>${statusPill(inv.status)}</td>
      <td>${money(inv.total || 0)}</td>
      <td>${new Date(inv.createdAt).toLocaleDateString()}</td>
    </tr>
  `).join('');

  document.getElementById('content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
      <div>
        <h1 style="font-size:1.6rem;">${contract.description}</h1>
        <p style="color:#8A98AC;">${client?.name || ''} &middot; ${client?.email || ''}</p>
      </div>
      <div style="text-align:right;">
        ${statusPill(contract.status)}
        <div style="margin-top:10px;">
          <button class="btn btn-sm" style="color:${contract.archived ? '#1B7A3C' : '#C0392B'};" onclick="archiveContract(${!contract.archived})">${contract.archived ? 'Unarchive' : 'Archive'}</button>
        </div>
      </div>
    </div>

    <table class="dash-table">
      <tbody>
        <tr><td style="font-weight:700; width:200px;">Monthly Amount</td><td>${money(contract.amount)}</td></tr>
        <tr><td style="font-weight:700;">Bills On</td><td>Day ${contract.billingDay} of each month</td></tr>
        <tr>
          <td style="font-weight:700;">Service Frequency</td>
          <td>
            <select id="visitFreq" onchange="saveVisitFrequency()" style="padding:6px 8px; border:1.5px solid #DCE4EF; border-radius:6px;">
              ${VISIT_FREQUENCIES.map(([k, l]) =>
                `<option value="${k}"${k === (contract.visitFrequency || 'monthly') ? ' selected' : ''}>${l}</option>`).join('')}
            </select>
            <span style="color:#8A98AC; font-size:0.8rem; margin-left:8px;">how often the crew is on site &mdash; not the same as when they are billed</span>
          </td>
        </tr>
        <tr><td style="font-weight:700;">Payment Method</td><td>${autoPay}</td></tr>
        <tr><td style="font-weight:700;">Last Billed</td><td>${contract.lastBilledAt ? new Date(contract.lastBilledAt).toLocaleDateString() : 'Never'}</td></tr>
        <tr><td style="font-weight:700;">Created</td><td>${new Date(contract.createdAt).toLocaleDateString()}</td></tr>
      </tbody>
    </table>

    ${statusActions ? `<div style="margin-top:16px;">${statusActions}</div>` : ''}

    <div id="contractChangeOrders" style="margin-top:28px;">Loading change orders…</div>

    <div id="visits" style="margin-top:28px;">Loading visits…</div>

    <h3 style="margin:28px 0 12px;">Billing History</h3>
    ${invoices.length ? `
      <table class="dash-table">
        <thead><tr><th>Invoice</th><th>Status</th><th>Total</th><th>Date</th></tr></thead>
        <tbody>${invoiceRows}</tbody>
      </table>
    ` : '<div class="empty-state">No invoices generated yet.</div>'}
  `;

  loadVisits();
  loadContractChangeOrders();
}

async function setStatus(status) {
  const verb = status === 'cancelled' ? 'cancel' : status === 'paused' ? 'pause' : 'resume';
  if (!(await adminConfirm(`Are you sure you want to ${verb} this contract?`, verb.charAt(0).toUpperCase() + verb.slice(1)))) return;
  const res = await adminFetch(`/api/admin/contracts/${id}/status`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status })
  });
  if (res.ok) load(); else adminToast('Failed to update contract.');
}

async function archiveContract(archived) {
  const res = await adminFetch(`/api/admin/contracts/${id}/archive`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived })
  });
  if (res.ok) load(); else adminToast('Failed to update contract.');
}

load();

/* ---------- Visits ----------
 *
 * A recurring contract used to produce exactly one work order, so a weekly
 * account had a single work order covering a year, one completedAt and one set
 * of actual hours. The profitability report was grading fifty-two visits from
 * one data point, and the schedule could not say who was going where.
 *
 * A visit is internal dispatch. The client signed the contract; nobody signs
 * again every Wednesday. So these are created silently -- no email, and nothing
 * for the client to do.
 */
// Must mirror FREQUENCIES in netlify/functions/_shared/serviceSchedule.mts.
const VISIT_FREQUENCIES = [
  ['one_time', 'One-time'], ['daily', 'Daily (Mon-Fri)'], ['3x_week', '3x per week'],
  ['2x_week', '2x per week'], ['weekly', 'Weekly'], ['biweekly', 'Every 2 weeks'],
  ['monthly', 'Monthly'], ['quarterly', 'Quarterly'], ['semiannual', 'Twice per year'],
  ['annual', 'Annually'],
];

async function saveVisitFrequency() {
  const res = await adminFetch(`/api/admin/contracts/${id}/visits`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ visitFrequency: document.getElementById('visitFreq').value }),
  });
  if (!res.ok) { adminToast('Could not change the service frequency.'); return; }
  load();
}

async function loadVisits() {
  const res = await adminFetch(`/api/admin/contracts/${id}/visits`);
  if (!res.ok) {
    document.getElementById('visits').innerHTML =
      '<p style="color:#C0392B; font-size:0.85rem;">Could not load visits.</p>';
    return;
  }
  renderVisits(await res.json());
}

function renderVisits({ visits, frequency }) {
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = visits.filter(v => v.scheduledDate && v.scheduledDate >= today && v.status !== 'completed');
  const done = visits.filter(v => v.status === 'completed');
  // A visit whose date has passed with no hours against it is the thing worth
  // surfacing: it is either work nobody logged or work nobody did.
  const missed = visits.filter(v => v.scheduledDate && v.scheduledDate < today && v.status !== 'completed');

  const row = (v) => `
    <tr>
      <td>${v.visitSequence ? 'Visit ' + v.visitSequence : '&mdash;'}</td>
      <td>${v.scheduledDate || 'Unscheduled'}</td>
      <td>${v.status === 'completed'
        ? '<span style="color:#1B7A3C; font-weight:700;">Done</span>'
        : v.scheduledDate && v.scheduledDate < today
          ? '<span style="color:#C0392B; font-weight:700;">Not logged</span>'
          : '<span style="color:#8A98AC;">Scheduled</span>'}</td>
      <td>${v.actualHours ? Number(v.actualHours) + ' hrs' : '&mdash;'}</td>
      <td style="text-align:right; white-space:nowrap;">
        <a href="/admin/work-order-detail.html?id=${v.id}" style="font-size:0.82rem;">Open</a>
        ${v.status !== 'completed' && v.actualHours == null
          ? ` &middot; <a href="#" onclick="removeVisit(${v.id}); return false;" style="font-size:0.82rem; color:#C0392B;">Remove</a>`
          : ''}
      </td>
    </tr>`;

  const table = (rows, label) => rows.length ? `
    <h4 style="margin:18px 0 8px; font-size:0.9rem; color:#4A5A72;">${label}</h4>
    <table class="dash-table">
      <thead><tr><th>Visit</th><th>Date</th><th>Status</th><th>Hours</th><th></th></tr></thead>
      <tbody>${rows.map(row).join('')}</tbody>
    </table>` : '';

  document.getElementById('visits').innerHTML = `
    <h3 style="margin:0 0 6px;">Service Visits</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:640px;">
      One work order per visit, so hours can be logged against the visit that used them.
      These are internal &mdash; the client signed the contract and gets nothing to sign here.
      ${frequency && frequency.recurring ? '' : 'Set a service frequency above to schedule any.'}
    </p>

    ${visits.length ? '' : '<p style="color:#8A98AC; font-size:0.85rem;">No visits scheduled yet.</p>'}
    ${table(missed, 'Past, no hours logged')}
    ${table(upcoming, 'Upcoming')}
    ${table(done.slice(0, 12), 'Completed' + (done.length > 12 ? ' (most recent 12 of ' + done.length + ')' : ''))}

    ${frequency && frequency.recurring ? `
      <div style="margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <label style="font-size:0.85rem; color:var(--navy); font-weight:600;">Schedule the next</label>
        <select id="visitMonths" style="padding:8px 10px; border:1.5px solid #DCE4EF; border-radius:6px;">
          <option value="1">1 month</option>
          <option value="3" selected>3 months</option>
          <option value="6">6 months</option>
          <option value="12">12 months</option>
        </select>
        <button type="button" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy);"
          onclick="generateVisits()">Generate visits</button>
        <span id="visitMsg" style="font-size:0.85rem;"></span>
      </div>
      <p style="color:#8A98AC; font-size:0.78rem; margin-top:6px;">
        Starts the day after the last visit already scheduled, so running this twice will not double anything.
        Capped at 90 at a time.
      </p>` : ''}

    ${upcoming.length ? `
      <p style="margin-top:14px;">
        <button type="button" class="btn btn-sm" style="color:#C0392B;" onclick="clearFutureVisits()">
          Clear the ${upcoming.length} upcoming ${upcoming.length === 1 ? 'visit' : 'visits'}
        </button>
        <span style="color:#8A98AC; font-size:0.78rem; margin-left:6px;">
          for when the contract changes. Anything with hours logged or already invoiced stays.
        </span>
      </p>` : ''}`;
}

async function generateVisits() {
  const msg = document.getElementById('visitMsg');
  msg.style.color = '#8A98AC';
  msg.textContent = 'Working…';
  const res = await adminFetch(`/api/admin/contracts/${id}/visits`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ months: Number(document.getElementById('visitMonths').value) }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { msg.style.color = '#C0392B'; msg.textContent = data.error || 'Could not generate visits.'; return; }

  // Re-render first, then say what happened. Setting the message before
  // loadVisits() writes it into a span that the re-render immediately throws
  // away, so the click appeared to do nothing.
  await loadVisits();
  const after = document.getElementById('visitMsg');
  if (after) {
    after.style.color = '#1B7A3C';
    after.textContent = 'Scheduled ' + data.created + '.';
  }
}


/**
 * Take a planned visit back off the calendar.
 *
 * Refused by the server for anything with hours against it or an invoice
 * behind it -- those are records, not plans. The link is hidden in those cases
 * too, but the server is the one that decides.
 */
async function removeVisit(visitId) {
  if (!(await adminConfirm('Remove this visit from the schedule?', 'Remove'))) return;
  const res = await adminFetch(`/api/admin/contracts/${id}/visits?visitId=${visitId}`, { method: 'DELETE' });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    adminToast(data.error || 'Could not remove that visit.');
    return;
  }
  loadVisits();
}

/** Clear the remaining run, for when a contract is cancelled or rescheduled. */
async function clearFutureVisits() {
  if (!(await adminConfirm(
    'Remove every upcoming visit on this contract? Visits with hours logged or already invoiced will stay.',
    'Clear upcoming',
  ))) return;
  const res = await adminFetch(`/api/admin/contracts/${id}/visits`, { method: 'DELETE' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { adminToast(data.error || 'Could not clear the visits.'); return; }
  await loadVisits();
  const msg = document.getElementById('visitMsg');
  if (msg) {
    msg.style.color = '#1B7A3C';
    msg.textContent = 'Removed ' + data.removed + (data.kept ? ', kept ' + data.kept + ' with a record against them.' : '.');
  }
}


/* ---------- Contract change orders ----------
 *
 * A one-off job is amended through its work order. A contract has none: adding
 * a floor to a weekly route changes the agreement itself, and the visits under
 * it are dispatch rather than the thing being renegotiated. Without this the
 * only way to reprice a contract was to edit the amount by hand, with nothing
 * recording what the client agreed to.
 *
 * Lines are priced per visit, the way the estimate prices recurring work. The
 * monthly effect is derived from the service frequency and shown before you
 * send it, because that is the number the client will actually see billed.
 */
let contractCoLines = [{ description: '', quantity: 1, unitPrice: '' }];
let contractCoState = { visitsPerYear: 0, currentMonthly: 0, frequencyLabel: '' };

const CO_REASONS = [
  ['client_request', 'Client requested additional work'],
  ['scope_clarification', 'Scope clarification'],
  ['condition_found', 'Condition found on site'],
  ['reduction', 'Scope removed at client request'],
];

const coStatusPill = (status) => {
  const map = {
    draft: ['Draft', '#8A98AC'],
    sent: ['Awaiting client', '#B7791F'],
    approved: ['Approved', '#1B7A3C'],
    declined: ['Declined', '#C0392B'],
  };
  const [label, color] = map[status] || [status, '#8A98AC'];
  return `<span style="font-size:0.75rem; font-weight:700; color:${color};">${label}</span>`;
};

async function loadContractChangeOrders() {
  const res = await adminFetch(`/api/admin/contracts/${id}/change-orders`);
  if (!res.ok) {
    document.getElementById('contractChangeOrders').innerHTML =
      '<p style="color:#C0392B; font-size:0.85rem;">Could not load change orders.</p>';
    return;
  }
  const data = await res.json();
  contractCoState = {
    visitsPerYear: data.frequency?.visitsPerYear || 0,
    currentMonthly: data.currentMonthly || 0,
    frequencyLabel: data.frequency?.label || '',
    recurring: !!data.frequency?.recurring,
  };
  renderContractChangeOrders(data.changeOrders || []);
}

function renderContractChangeOrders(cos) {
  const rows = cos.map(co => `
    <tr>
      <td style="font-weight:700; white-space:nowrap;">${co.number}</td>
      <td>${escAttrC(co.description).slice(0, 70)}${co.description.length > 70 ? '…' : ''}</td>
      <td style="text-align:right; white-space:nowrap;">${money(co.total)}<div style="font-size:0.72rem; color:#8A98AC;">per visit</div></td>
      <td style="text-align:right; white-space:nowrap;">${co.newMonthlyAmount != null ? money(co.newMonthlyAmount) : '—'}<div style="font-size:0.72rem; color:#8A98AC;">new monthly</div></td>
      <td>${coStatusPill(co.status)}</td>
      <td style="text-align:right; white-space:nowrap;">
        <a href="/change-order.html?t=${co.token}&preview=1" target="_blank" style="font-size:0.82rem;">Preview</a>
        &middot; <a href="/api/change-order/${co.token}/pdf?view=1" target="_blank" style="font-size:0.82rem;">PDF</a>
        ${co.status === 'draft' ? `
          &middot; <a href="#" onclick="sendContractChangeOrder(${co.id}); return false;" style="font-size:0.82rem;">Send</a>
          &middot; <a href="#" onclick="deleteContractChangeOrder(${co.id}); return false;" style="font-size:0.82rem; color:#C0392B;">Delete</a>` : ''}
      </td>
    </tr>`).join('');

  document.getElementById('contractChangeOrders').innerHTML = `
    <h3 style="margin:0 0 6px;">Change Orders</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:640px;">
      For changing what this contract covers and what it charges. Priced per visit; the monthly
      figure follows from the service frequency. Approving one moves the contract amount, so every
      invoice after it bills the new rate.
    </p>

    ${cos.length ? `
      <table class="dash-table">
        <thead><tr><th>Number</th><th>What changed</th><th style="text-align:right;">Per visit</th><th style="text-align:right;">Monthly</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    ` : '<p style="color:#8A98AC; font-size:0.85rem;">No change orders on this contract.</p>'}

    ${contractCoState.recurring ? `
      <button type="button" class="btn btn-outline btn-sm" style="margin-top:12px; color:var(--navy); border-color:var(--navy);"
        onclick="toggleContractCoForm()">+ New change order</button>` : `
      <p style="color:#B7791F; font-size:0.82rem; margin-top:10px;">
        Set a service frequency above before changing the rate &mdash; without one there is no way to turn
        a per-visit price into a monthly charge.
      </p>`}

    <div id="contractCoForm" style="display:none; margin-top:16px; padding:18px; border:1.5px solid #DCE4EF; border-radius:12px; background:#F8FAFD;">
      <div class="field-group">
        <label for="ccoDescription">What is changing</label>
        <textarea id="ccoDescription" rows="3" placeholder="Adding the third-floor break room to the nightly route."></textarea>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 16px;">
        <div class="field-group">
          <label for="ccoReason">Reason</label>
          <select id="ccoReason">
            <option value="">&mdash;</option>
            ${CO_REASONS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <label for="ccoPo">PO number for this change</label>
          <input type="text" id="ccoPo" placeholder="Leave blank if the contract PO covers it">
        </div>
      </div>

      <label style="display:block; font-size:0.82rem; font-weight:600; margin-bottom:6px; color:var(--navy);">Lines, priced per visit</label>
      <p style="color:#8A98AC; font-size:0.78rem; margin:0 0 8px;">
        A negative price removes scope and lowers the monthly charge.
      </p>
      <div id="ccoLines"></div>
      <button type="button" class="btn btn-sm" style="color:var(--blue);" onclick="addContractCoLine()">+ Add line</button>

      <div id="ccoEffect" class="totals-row" style="margin-top:10px;"></div>
      <p class="error-text" id="ccoError"></p>
      <div style="margin-top:10px;">
        <button type="button" class="btn btn-primary btn-sm" onclick="saveContractChangeOrder()">Save as draft</button>
        <button type="button" class="btn btn-sm" style="color:#8A98AC;" onclick="toggleContractCoForm()">Cancel</button>
      </div>
    </div>`;

  renderContractCoLines();
}

function escAttrC(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function toggleContractCoForm() {
  const el = document.getElementById('contractCoForm');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function addContractCoLine() {
  contractCoLines.push({ description: '', quantity: 1, unitPrice: '' });
  renderContractCoLines();
}

function removeContractCoLine(i) {
  contractCoLines.splice(i, 1);
  if (!contractCoLines.length) contractCoLines = [{ description: '', quantity: 1, unitPrice: '' }];
  renderContractCoLines();
}

function updateContractCoLine(i, field, value) {
  contractCoLines[i][field] = value;
  updateContractCoEffect();
}

function renderContractCoLines() {
  const host = document.getElementById('ccoLines');
  if (!host) return;
  host.innerHTML = contractCoLines.map((l, i) => `
    <div style="display:grid; grid-template-columns:1fr 70px 110px 30px; gap:8px; margin-bottom:8px; align-items:center;">
      <input type="text" placeholder="Description" value="${escAttrC(l.description)}"
        oninput="updateContractCoLine(${i}, 'description', this.value)">
      <input type="number" step="any" placeholder="Qty" value="${l.quantity}"
        oninput="updateContractCoLine(${i}, 'quantity', this.value)">
      <input type="number" step="any" placeholder="Per visit" value="${l.unitPrice}"
        oninput="updateContractCoLine(${i}, 'unitPrice', this.value)">
      <button type="button" style="background:none; border:none; color:#C0392B; cursor:pointer; font-size:1.1rem;"
        onclick="removeContractCoLine(${i})" title="Remove line">&times;</button>
    </div>`).join('');
  updateContractCoEffect();
}

/*
 * Mirrors contractChangeEffect on the server, so the figure shown while typing
 * is the one that ends up on the document. If these two ever disagree the
 * client signs something the admin did not see.
 */
function updateContractCoEffect() {
  const el = document.getElementById('ccoEffect');
  if (!el) return;
  const perVisit = contractCoLines.reduce(
    (s, l) => s + (Number(l.quantity) || 0) * (Number(l.unitPrice) || 0), 0);
  const vpy = contractCoState.visitsPerYear || 0;
  const monthlyDelta = vpy > 0 ? Math.round((perVisit * vpy / 12) * 100) / 100 : 0;
  const newMonthly = Math.max(0, Math.round((contractCoState.currentMonthly + monthlyDelta) * 100) / 100);

  el.innerHTML = `${money(perVisit)} per visit
    <span style="font-weight:400; color:#8A98AC;">
      &middot; ${money(contractCoState.currentMonthly)} &rarr; <strong style="color:var(--navy);">${money(newMonthly)}</strong> a month
    </span>`;
}

function ccoError(msg) {
  const el = document.getElementById('ccoError');
  if (el) { el.textContent = msg; el.classList.add('show'); }
}

async function saveContractChangeOrder() {
  ccoError('');
  const res = await adminFetch(`/api/admin/contracts/${id}/change-orders`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      description: document.getElementById('ccoDescription').value.trim(),
      reason: document.getElementById('ccoReason').value || undefined,
      poNumber: document.getElementById('ccoPo').value.trim() || undefined,
      lineItems: contractCoLines
        .filter(l => l.description.trim())
        .map(l => ({ description: l.description.trim(), quantity: Number(l.quantity) || 0, unitPrice: Number(l.unitPrice) || 0 })),
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) return ccoError(data.error || 'Could not save this change order.');
  contractCoLines = [{ description: '', quantity: 1, unitPrice: '' }];
  loadContractChangeOrders();
}

async function sendContractChangeOrder(coId) {
  if (!(await adminConfirm('Email this change order to the client for signature?', 'Send'))) return;
  const res = await adminFetch(`/api/admin/change-orders/${coId}?action=send`, { method: 'POST' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { adminToast(data.error || 'Could not send it.'); return; }
  if (!data.emailed) adminToast('Saved as sent, but the email did not go out. Send them the link yourself.');
  loadContractChangeOrders();
}

async function deleteContractChangeOrder(coId) {
  if (!(await adminConfirm('Delete this draft change order?', 'Delete'))) return;
  const res = await adminFetch(`/api/admin/change-orders/${coId}`, { method: 'DELETE' });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    adminToast(data.error || 'Could not delete it.');
    return;
  }
  loadContractChangeOrders();
}

</script>
