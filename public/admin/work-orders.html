<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Orders | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <div class="container">
      <img src="../images/logo.png" alt="Renovo">
      <div style="display:flex; gap:24px; align-items:center;">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/schedule.html">Schedule</a>
        <a href="/admin/contracts.html">Contracts</a>
        <a href="/admin/work-orders.html">Work Orders</a>
        <a href="/admin/subcontractors.html">Subcontractors</a>
        <a href="/admin/documents.html">Documents</a>
        <a href="/admin/profitability.html">Profit</a>
        <a href="/admin/estimate-new.html">+ New Estimate</a>
        <a href="/admin/invoice-new.html">+ New Invoice</a>
        <button onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="admin-wrap">
    <div class="dash-header">
      <h1 style="font-size:1.6rem;">Work Orders</h1>
      <div style="display:flex; gap:10px;">
        <select id="statusFilter" onchange="load()" style="padding:9px 14px; border-radius:999px; border:1px solid #DCE4EF; font-size:0.85rem; font-weight:600; color:var(--navy); font-family:var(--font-head);">
          <option value="">All</option>
          <option value="pending">Pending Signature</option>
          <option value="signed">Signed</option>
        </select>
      </div>
    </div>
    <div id="content">Loading…</div>
  </div>

<script src="../js/admin.js"></script>
<script>
async function load() {
  const status = document.getElementById('statusFilter').value;
  const res = await adminFetch(`/api/admin/work-orders${status ? `?status=${status}` : ''}`);
  const data = await res.json();
  const content = document.getElementById('content');

  if (!data.workOrders.length) {
    content.innerHTML = '<div class="empty-state">No work orders found.</div>';
    return;
  }

  const rows = data.workOrders.map(w => {
    const link = `${window.location.origin}/work-order.html?t=${w.token}`;
    return `
      <tr>
        <td><a href="/admin/work-order-detail.html?id=${w.id}">Work Order #${w.id}</a></td>
        <td>${w.clientName || '—'}</td>
        <td>${statusPill(w.status)}</td>
        <td>${new Date(w.createdAt).toLocaleDateString()}</td>
        <td>${w.signedAt ? new Date(w.signedAt).toLocaleDateString() : '—'}</td>
        <td style="font-size:0.82rem; word-break:break-all;"><a href="${link}" target="_blank">${link}</a></td>
      </tr>
    `;
  }).join('');

  content.innerHTML = `
    <table class="dash-table">
      <thead><tr><th>Work Order</th><th>Client</th><th>Status</th><th>Created</th><th>Signed</th><th>Client Link</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

load();
</script>
</body>
</html>
