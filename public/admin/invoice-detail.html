<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Detail | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <div class="container">
      <img src="../images/logo.png" alt="Renovo">
      <div style="display:flex; gap:24px; align-items:center;">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/contracts.html">Contracts</a>
        <a href="/admin/work-orders.html">Work Orders</a>
        <a href="/admin/subcontractors.html">Subcontractors</a>
        <a href="/admin/documents.html">Documents</a>
        <a href="/admin/estimate-new.html">+ New Estimate</a>
        <a href="/admin/invoice-new.html">+ New Invoice</a>
        <button onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="admin-wrap" style="max-width:720px;">
    <a href="/admin/dashboard.html" style="color:var(--blue); font-size:0.9rem;">&larr; Back to Dashboard</a>
    <div id="content" style="margin-top:20px;">Loading…</div>
  </div>

<script src="../js/admin.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');

let lastBalanceDue = 0;

async function load() {
  const res = await adminFetch(`/api/admin/invoices/${id}`);
  if (!res.ok) { document.getElementById('content').innerHTML = '<div class="empty-state">Invoice not found.</div>'; return; }
  const { invoice, client, lineItems, payments, subtotal, total, amountPaid, balanceDue } = await res.json();
  lastBalanceDue = balanceDue;

  const itemsHtml = lineItems.map(li => `
    <tr><td>${li.description}</td><td>${li.quantity}</td><td>${money(li.unitPrice)}</td><td>${money(li.quantity * li.unitPrice)}</td></tr>
  `).join('');

  const invoiceLink = `${window.location.origin}/invoice.html?t=${invoice.token}`;
  const pdfLink = `${window.location.origin}/api/invoice/${invoice.token}/pdf`;
  const invNumber = `INV-${1000 + invoice.id}`;

  let actions = '';
  if (invoice.status === 'paid') {
    actions = `<p style="color:#1B7A3C; font-weight:700;">✅ Paid in full ${new Date(invoice.paidAt).toLocaleDateString()}</p>`;
  } else {
    actions = `
      <button class="btn btn-primary" id="sendInvoiceBtn" onclick="sendInvoice()">Send to Client</button>
      <button class="btn btn-outline" id="recordPaymentBtn" style="color:var(--navy); border-color:var(--navy);" onclick="toggleRecordPayment()">Record Payment</button>
    `;
  }

  const paymentForm = invoice.status === 'paid' ? '' : `
    <div id="recordPaymentForm" style="display:none; background:var(--off-white); border-radius:12px; padding:20px; margin-top:16px;">
      <div class="field-group"><label>Amount ($)</label><input type="number" id="paymentAmount" min="0.01" max="${balanceDue}" step="0.01" value="${balanceDue.toFixed(2)}"></div>
      <div class="field-group">
        <label>Method</label>
        <select id="paymentMethod">
          <option value="cash">Cash</option>
          <option value="check">Check</option>
          <option value="card">Card (in person)</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field-group"><label>Note (optional)</label><input type="text" id="paymentNote" placeholder="e.g. Deposit collected on-site"></div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline btn-sm" type="button" onclick="toggleRecordPayment()">Cancel</button>
        <button class="btn btn-primary btn-sm" type="button" id="confirmPaymentBtn" onclick="submitPayment()">Confirm Payment</button>
      </div>
    </div>
  `;

  const paymentsLedger = payments && payments.length ? `
    <h3 style="margin:24px 0 10px; font-size:1rem;">Payments Received</h3>
    <table class="dash-table">
      <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Note</th></tr></thead>
      <tbody>${payments.map(p => `<tr><td>${new Date(p.createdAt).toLocaleDateString()}</td><td>${money(p.amount)}</td><td style="text-transform:capitalize;">${p.method}</td><td>${p.note || '—'}</td></tr>`).join('')}</tbody>
    </table>
  ` : '';

  const totalsHtml = amountPaid > 0
    ? `
      ${invoice.taxApplied ? `<div class="totals-row" style="font-size:0.9rem; color:#4A5A72;">Subtotal: ${money(subtotal)}</div><div class="totals-row" style="font-size:0.9rem; color:#4A5A72;">Utah Sales Tax (7.25%): ${money(invoice.taxAmount)}</div>` : ''}
      <div class="totals-row" style="font-size:0.9rem; color:#1B7A3C;">Amount Paid: −${money(amountPaid)}</div>
      <div class="totals-row">Balance Due: ${money(balanceDue)}</div>
    `
    : `
      ${invoice.taxApplied ? `<div class="totals-row" style="font-size:0.9rem; color:#4A5A72;">Subtotal: ${money(subtotal)}</div><div class="totals-row" style="font-size:0.9rem; color:#4A5A72;">Utah Sales Tax (7.25%): ${money(invoice.taxAmount)}</div>` : ''}
      <div class="totals-row">Total: ${money(total)}</div>
    `;

  document.getElementById('content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
      <div>
        <h1 style="font-size:1.6rem;">${invNumber}</h1>
        <p style="color:#8A98AC;">${client?.name || ''} &middot; ${client?.email || ''}</p>
      </div>
      <div style="text-align:right;">
        ${statusPill(invoice.status)}
        <div style="margin-top:10px;">
          <button class="btn btn-sm" style="color:${invoice.archived ? '#1B7A3C' : '#C0392B'};" onclick="archiveInvoice(${!invoice.archived})">${invoice.archived ? 'Unarchive' : 'Archive'}</button>
        </div>
      </div>
    </div>

    <table class="dash-table">
      <thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
      <tbody>${itemsHtml}</tbody>
    </table>
    ${totalsHtml}

    ${invoice.notes ? `<p style="margin-top:16px; color:#4A5A72;"><strong>Notes:</strong> ${invoice.notes}</p>` : ''}
    ${invoice.dueDate ? `<p style="color:#4A5A72;"><strong>Due:</strong> ${invoice.dueDate}</p>` : ''}

    ${paymentsLedger}

    <p style="margin-top:20px; font-size:0.85rem; word-break:break-all;"><strong>Client link:</strong> <a href="${invoiceLink}" target="_blank">${invoiceLink}</a></p>
    <p style="font-size:0.85rem;"><a href="${pdfLink}" target="_blank">⬇ Download PDF</a></p>

    <div style="margin-top:24px; display:flex; gap:12px;">${actions}</div>
    ${paymentForm}
    <p id="actionError" class="error-text"></p>
  `;
}

function toggleRecordPayment() {
  const form = document.getElementById('recordPaymentForm');
  if (!form) return;
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function submitPayment() {
  const amount = Number(document.getElementById('paymentAmount').value);
  const method = document.getElementById('paymentMethod').value;
  const note = document.getElementById('paymentNote').value;
  if (!amount || amount <= 0) { adminToast('Enter a valid payment amount.'); return; }
  if (amount > lastBalanceDue + 0.01) { adminToast(`Amount exceeds the balance due (${money(lastBalanceDue)}).`); return; }

  const btn = document.getElementById('confirmPaymentBtn');
  btn.disabled = true;
  btn.textContent = 'Recording…';
  try {
    const res = await adminFetch(`/api/admin/invoices/${id}/record-payment`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount, method, note })
    });
    if (res.ok) { load(); return; }
    const data = await res.json().catch(() => ({}));
    showError(data.error || 'Failed to record payment.');
  } catch (err) {
    showError('Failed to record payment. Please check your connection and try again.');
  }
  btn.disabled = false;
  btn.textContent = 'Confirm Payment';
}

async function sendInvoice() {
  const btn = document.getElementById('sendInvoiceBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await adminFetch(`/api/admin/invoices/${id}/send`, { method: 'POST' });
    if (res.ok) { load(); return; }
    showError('Failed to send invoice.');
  } catch (err) {
    showError('Failed to send invoice. Please check your connection and try again.');
  }
  btn.disabled = false;
  btn.textContent = 'Send to Client';
}

async function archiveInvoice(archived) {
  const res = await adminFetch(`/api/admin/invoices/${id}/archive`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived })
  });
  if (res.ok) load(); else showError('Failed to update invoice.');
}

function showError(msg) {
  const el = document.getElementById('actionError');
  if (el) { el.textContent = msg; el.classList.add('show'); }
}

load();
</script>
</body>
</html>
