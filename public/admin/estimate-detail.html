<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimate Detail | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <div class="container">
      <img src="../images/logo.png" alt="Renovo">
      <div style="display:flex; gap:24px; align-items:center;">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/schedule.html">Schedule</a>
        <a href="/admin/contracts.html">Contracts</a>
        <a href="/admin/work-orders.html">Work Orders</a>
        <a href="/admin/subcontractors.html">Subcontractors</a>
        <a href="/admin/bid-board.html">Bid Board</a>
        <a href="/admin/documents.html">Documents</a>
        <a href="/admin/profitability.html">Profit</a>
        <a href="/admin/estimate-new.html">+ New Estimate</a>
        <a href="/admin/invoice-new.html">+ New Invoice</a>
        <button onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="admin-wrap" style="max-width:720px;">
    <a href="/admin/dashboard.html" style="color:var(--blue); font-size:0.9rem;">&larr; Back to Dashboard</a>
    <div id="content" style="margin-top:20px;">Loading…</div>
  </div>

<script src="../js/admin.js"></script>
<script src="../js/photo-resize.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');

async function load() {
  const res = await adminFetch(`/api/admin/estimates/${id}`);
  if (!res.ok) { document.getElementById('content').innerHTML = '<div class="empty-state">Estimate not found.</div>'; return; }
  const { estimate, client, lineItems, workOrder, invoice } = await res.json();

  const total = lineItems.reduce((sum, li) => sum + Number(li.quantity) * Number(li.unitPrice), 0);
  const itemsHtml = lineItems.map(li => `
    <tr><td>${li.description}</td><td>${li.quantity}</td><td>${money(li.unitPrice)}</td><td>${money(li.quantity * li.unitPrice)}</td></tr>
  `).join('');

  const estimateLink = `${window.location.origin}/estimate.html?t=${estimate.token}`;

  /*
   * A quoted recurring job does not bill itself. Until the contract exists the
   * scheduled biller has nothing to find, so a weekly job can be sold, worked,
   * and never invoiced because nobody set the billing up.
   */
  const VISITS_PER_YEAR = { daily: 260, '3x_week': 156, '2x_week': 104, weekly: 52, biweekly: 26, monthly: 12, quarterly: 4, semiannual: 2, annual: 1 };
  const recurringLines = lineItems.filter(li => !li.isOptional && VISITS_PER_YEAR[li.frequency]);
  const annualRecurring = recurringLines.reduce((t, li) =>
    t + Number(li.quantity) * Number(li.unitPrice) * VISITS_PER_YEAR[li.frequency], 0);

  let recurringSection = '';
  if (recurringLines.length) {
    recurringSection = `
      <h3 style="margin:28px 0 6px;">Recurring Billing</h3>
      <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:620px;">
        This estimate carries ${recurringLines.length} recurring line${recurringLines.length === 1 ? '' : 's'},
        worth <strong>${money(annualRecurring)}</strong> a year, averaging <strong>${money(annualRecurring / 12)}</strong>
        a month. Setting up billing schedules those charges; until then nothing invoices itself.
      </p>
      <div id="recurringStatus"></div>`;
  }

  let actions = '';
  if (estimate.status === 'draft') {
    actions = `<button class="btn btn-primary" id="sendEstimateBtn" onclick="sendEstimate()">Send to Client</button>`;
  } else if (estimate.status === 'approved' && !workOrder) {
    actions = `<button class="btn btn-primary" id="convertBtn" onclick="convertToWorkOrder()">Convert to Work Order</button>`;
  }

  let workOrderSection = '';
  if (workOrder) {
    const woLink = `${window.location.origin}/work-order.html?t=${workOrder.token}`;
    let invoiceHtml = '';
    if (invoice) {
      const invLink = `${window.location.origin}/invoice.html?t=${invoice.token}`;
      invoiceHtml = `
        <h3 style="margin:28px 0 12px;">Invoice</h3>
        <p>Status: ${statusPill(invoice.status)}</p>
        <p style="margin-top:10px; font-size:0.85rem;"><a href="${invLink}" target="_blank">${invLink}</a></p>
        <p style="margin-top:10px;"><a href="/admin/invoice-detail.html?id=${invoice.id}" class="btn btn-primary btn-sm">Manage Invoice</a></p>
      `;
    } else if (workOrder.status === 'signed') {
      invoiceHtml = `<div style="margin-top:20px;"><a href="/admin/invoice-new.html?workOrderId=${workOrder.id}" class="btn btn-primary btn-sm">Create Invoice</a></div>`;
    }
    workOrderSection = `
      <h3 style="margin:28px 0 12px;">Work Order</h3>
      <p>Status: ${statusPill(workOrder.status)}</p>
      <p style="margin-top:10px; font-size:0.85rem;"><a href="${woLink}" target="_blank">${woLink}</a></p>
      <p style="margin-top:10px;"><a href="/admin/work-order-detail.html?id=${workOrder.id}" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy);">View Work Order Details</a></p>
      ${invoiceHtml}
    `;
  }

  document.getElementById('content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
      <div>
        <h1 style="font-size:1.6rem;">Estimate #${estimate.id}</h1>
        <p style="color:#8A98AC;">${client?.name || ''} &middot; ${client?.email || ''}</p>
      </div>
      <div style="text-align:right;">
        ${statusPill(estimate.status)}
        <div style="margin-top:10px;">
          <button class="btn btn-sm" style="color:${estimate.archived ? '#1B7A3C' : '#C0392B'};" onclick="archiveEstimate(${!estimate.archived})">${estimate.archived ? 'Unarchive' : 'Archive'}</button>
        </div>
      </div>
    </div>

    <table class="dash-table">
      <thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
      <tbody>${itemsHtml}</tbody>
    </table>
    ${estimate.taxApplied ? `<div class="totals-row" style="font-size:0.9rem; color:#4A5A72;">Subtotal: ${money(total)}</div><div class="totals-row" style="font-size:0.9rem; color:#4A5A72;">Utah Sales Tax (7.25%): ${money(estimate.taxAmount)}</div>` : ''}
    <div class="totals-row">Total: ${money(total + Number(estimate.taxAmount || 0))}</div>

    ${estimate.notes ? `<p style="margin-top:16px; color:#4A5A72;"><strong>Notes:</strong> ${estimate.notes}</p>` : ''}
    ${estimate.validUntil ? `<p style="color:#4A5A72;"><strong>Valid Until:</strong> ${estimate.validUntil}</p>` : ''}

    ${estimate.poNumber ? `
      <h3 style="margin:28px 0 6px;">Purchase Order</h3>
      <p style="font-size:0.95rem;"><strong>${escapeAttr(estimate.poNumber)}</strong></p>
      <p style="color:#8A98AC; font-size:0.82rem;">Carried onto the work order and every invoice raised from this job.</p>
    ` : ''}

    <h3 style="margin:28px 0 6px;">What the client sees</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px;">
      Preview opens the proposal exactly as they will read it, without recording a view or notifying you.
      The client link is the real one &mdash; opening that counts as them reading it.
    </p>
    <p>
      <a href="${estimateLink}&preview=1" target="_blank" class="btn btn-primary btn-sm" style="text-decoration:none;">Preview as the client</a>
      <a href="/api/proposal/${estimate.token}/pdf?view=1" target="_blank" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy); margin-left:8px; text-decoration:none;">Preview the PDF</a>
    </p>
    <p style="margin-top:20px; font-size:0.85rem; word-break:break-all;"><strong>Client link:</strong> <a href="${estimateLink}" target="_blank">${estimateLink}</a></p>

    <p style="margin-top:10px;">
      <a href="/api/proposal/${estimate.token}/pdf" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy); text-decoration:none;">Download proposal PDF</a>
      <a href="/api/proposal/${estimate.token}/pdf?view=1" target="_blank" style="margin-left:12px; font-size:0.85rem;">Preview it</a>
    </p>
    <p style="color:#8A98AC; font-size:0.8rem; margin-top:4px;">
      The same file the client receives attached to their proposal email. Use it for a procurement portal that wants an upload.
    </p>

    ${recurringSection}

    <h3 style="margin:28px 0 6px;">Walk-Through Photos</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px;">
      These appear on the client proposal as documented site conditions. They are what settles a scope
      argument later, so photograph what the price assumes: soil load, access, anything already damaged.
    </p>
    <div id="estPhotos"></div>

    <h3 style="margin:28px 0 6px;">Lien Deadlines</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:660px;">
      A lien is the only real leverage you have when a general contractor stops answering the phone,
      and it is the easiest thing to lose &mdash; the right is preserved in the first days of a job
      nobody expects to go bad. This is a calendar, not legal advice: the windows are Utah defaults
      worth confirming with counsel, and the point is being reminded on day four rather than
      remembering on day forty.
    </p>
    <div id="lienPanel">Loading…</div>

    <h3 style="margin:28px 0 6px;">The Envelope</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:660px;">
      The cheapest number does not win if the envelope is incomplete. A bid that missed an addendum,
      or arrived without the insurance certificate, is thrown out as non-responsive before anyone
      reads the price &mdash; and you usually find out weeks later, if at all.
    </p>
    <div id="bidDesk">Loading…</div>

    <h3 style="margin:28px 0 6px;">How This Bid Finished</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:660px;">
      The winner's number is the most useful figure a losing bid ever produces, and it is only
      findable for a week or two after the award. Recorded here, it tells you whether the next bid
      is priced right. Left blank, every bid is priced from the same assumptions as the last one
      whether that one won or lost by forty percent.
    </p>
    <div id="outcomePanel">Loading…</div>

    <h3 style="margin:28px 0 6px;">Scope, Exclusions &amp; Clarifications</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px; max-width:660px;">
      Everything below is on the proposal the client reads and the PDF they keep. The standard terms
      come from the service library; the lines you add here are written for this job. On a construction
      bid the clarifications are what decide who pays &mdash; that the building is released floor by
      floor, that the parking structure is out, that another trade's overspray is not yours to remove.
    </p>
    <div id="scopeEditor">Loading scope…</div>

    <div style="margin-top:24px;">${actions}</div>
    ${workOrderSection}
  `;

  renderOutcome(estimate);
  loadLien();
  loadBidDesk();
  loadScope();
  loadPhotos();
  if (recurringLines.length) loadRecurring();
}

async function loadRecurring() {
  const box = document.getElementById('recurringStatus');
  if (!box) return;
  let existing = null;
  try {
    const res = await adminFetch('/api/admin/contracts');
    if (res.ok) {
      const { contracts } = await res.json();
      existing = (contracts || []).find(c => Number(c.estimateId) === Number(id)) || null;
    }
  } catch (err) { /* offer setup anyway */ }

  box.innerHTML = existing
    ? `<p style="color:#1B7A3C; font-size:0.9rem;">Billing is set up &mdash; <strong>${money(existing.amount)}</strong>
       on day ${existing.billingDay} of each month.
       <a href="/admin/contract-detail.html?id=${existing.id}" style="margin-left:8px;">Manage</a></p>`
    : `<button type="button" class="btn btn-primary btn-sm" id="setupBillingBtn" onclick="setUpRecurring()">Set Up Monthly Billing</button>`;
}

async function setUpRecurring() {
  const btn = document.getElementById('setupBillingBtn');
  btn.disabled = true;
  btn.textContent = 'Setting up\u2026';
  const res = await adminFetch('/api/admin/estimates/' + id + '/recurring-contract', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ billingDay: 1 }),
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    adminToast('Monthly billing set up at ' + money(data.monthlyAverage) + '.', 'success');
    load();
    return;
  }
  adminToast(data.error || 'Could not set up billing.');
  btn.disabled = false;
  btn.textContent = 'Set Up Monthly Billing';
}

const MAX_PROPOSAL_PHOTOS = 12;

/* ---------- Lien deadlines ----------
 *
 * Dates are typed rather than inferred from the schedule. "First furnished
 * labor" is a legal fact about a job, and guessing it from the first row in
 * this database would produce a deadline that looks authoritative and is not.
 * A wrong date here is worse than no date: it reassures.
 */
const LIEN_TONE = {
  overdue: 'wage-warn wage-warn-hard',
  'due-soon': 'wage-warn',
  ok: 'wage-warn wage-warn-ok',
  done: 'wage-warn wage-warn-ok',
  waived: 'wage-warn',
  none: '',
};

async function loadLien() {
  const box = document.getElementById('lienPanel');
  if (!box) return;
  const res = await adminFetch(`/api/admin/estimates/${id}/lien`);
  if (!res.ok) { box.innerHTML = '<div class="empty-state" style="padding:18px;">Could not load the lien calendar.</div>'; return; }
  renderLien(await res.json());
}

function renderLien(d) {
  const box = document.getElementById('lienPanel');
  if (!box) return;
  const l = d.lien || {};

  const steps = (d.steps || []).map(s => `
    <div class="${LIEN_TONE[s.urgency] || 'wage-warn'}" style="margin:0 0 8px;">
      <strong>${scopeEsc(s.label)}.</strong> ${scopeEsc(s.message)}
    </div>`).join('');

  const field = (id_, label, value, type = 'date', help = '') => `
    <div class="field-group">
      <label for="${id_}">${label}</label>
      <input type="${type}" id="${id_}" value="${scopeEsc(value || '')}">
      ${help ? `<p style="font-size:0.76rem; color:#8A98AC; margin-top:4px;">${help}</p>` : ''}
    </div>`;

  const isPublic = l.projectType === 'public';

  /*
   * The two remedies do not share a form.
   *
   * A lien does not attach to a school, so on public work the private fields
   * are not merely unused -- filling them in would produce a deadline for a
   * remedy that does not exist here. The bond date is asked for rather than
   * computed, because it turns on whether Renovo contracts directly with the
   * general contractor, and that is a lawyer's question.
   */
  const privateFields = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 16px;">
        ${field('lienFirstWork', 'First day we furnished labor', l.firstWorkDate, 'date',
          `The clock starts here. Preliminary notice is due ${d.windows.preliminaryDays} days later.`)}
        ${field('lienPrelimFiled', 'Preliminary notice filed', l.preliminaryFiledAt, 'date',
          'Utah files these on the State Construction Registry.')}
        ${field('lienPrelimRef', 'Registry reference', l.preliminaryReference, 'text',
          'So the filing can be produced later without hunting for it.')}
        ${field('lienCompletion', 'Final completion of the project', l.completionDate, 'date',
          `Not our last day &mdash; the project's. The lien window is ${d.windows.lienDays} days from here.`)}
        ${field('lienFiled', 'Lien filed', l.lienFiledAt, 'date', '')}
      </div>`;

  const publicFields = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 16px;">
        ${field('lienBondRef', 'Bond and surety', l.bondReference, 'text',
          'Ask the general contractor for a copy now, while they are still pleased with you.')}
        ${field('lienBondDue', 'Notice deadline', l.bondNoticeDue, 'date',
          'From the bond or from counsel. Not computed here &mdash; it depends on whether you contract with the GC directly.')}
        ${field('lienBondFiled', 'Notice given', l.bondNoticeFiledAt, 'date', '')}
      </div>`;

  box.innerHTML = steps + `
    <div class="scope-group" style="max-width:660px;">
      <div class="field-group">
        <label for="lienProjectType">Who owns the property</label>
        <select id="lienProjectType" onchange="saveLien()">
          <option value="private"${isPublic ? '' : ' selected'}>Private owner &mdash; a lien can attach</option>
          <option value="public"${isPublic ? ' selected' : ''}>Public owner &mdash; school, city, state, federal</option>
        </select>
        <p style="font-size:0.76rem; color:#8A98AC; margin-top:4px;">
          No lien attaches to public property. On a public job the remedy is a claim against the general
          contractor's payment bond instead, which is a different document on a different clock.
        </p>
      </div>
      ${isPublic ? publicFields : privateFields}
      <div class="field-group">
        <label for="lienNotes">Notes</label>
        <textarea id="lienNotes" rows="2" placeholder="e.g. GC is Okland; owner is the school district, so this may be a bond claim rather than a lien.">${scopeEsc(l.notes || '')}</textarea>
      </div>
      <div class="consent-row" style="margin-top:0;">
        <input type="checkbox" id="lienWaived" ${l.waived ? 'checked' : ''}>
        <label for="lienWaived">Not preserving lien rights on this job &mdash; stop reminding me</label>
      </div>
      <p class="error-text" id="lienError"></p>
      <button type="button" class="btn btn-primary btn-sm" onclick="saveLien()">Save dates</button>
    </div>`;
}

async function saveLien() {
  const err = document.getElementById('lienError');
  err.textContent = ''; err.classList.remove('show');
  // Only the fields on screen are sent. The other remedy's dates are not
  // cleared behind your back, so switching type by mistake loses nothing.
  const val = (elId) => document.getElementById(elId)?.value || null;
  const res = await adminFetch(`/api/admin/estimates/${id}/lien`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      projectType: document.getElementById('lienProjectType').value,
      ...(document.getElementById('lienFirstWork') ? {
        firstWorkDate: val('lienFirstWork'),
        preliminaryFiledAt: val('lienPrelimFiled'),
        preliminaryReference: val('lienPrelimRef'),
        completionDate: val('lienCompletion'),
        lienFiledAt: val('lienFiled'),
      } : {
        bondReference: val('lienBondRef'),
        bondNoticeDue: val('lienBondDue'),
        bondNoticeFiledAt: val('lienBondFiled'),
      }),
      notes: val('lienNotes'),
      waived: document.getElementById('lienWaived').checked,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { err.textContent = data.error || 'Could not save that.'; err.classList.add('show'); return; }
  renderLien(data);
  adminToast('Lien calendar updated.', 'success');
}

/* ---------- The envelope: addenda and submittals ----------
 *
 * Two lists that decide whether the bid is read at all. The send route refuses
 * on an unacknowledged addendum -- that is a fact recorded here on purpose --
 * and only warns about a missing submittal, which may well already be attached
 * to the email. Blocking on what the app cannot know is how a safety rail
 * becomes an obstacle people learn to route around.
 */
let deskState = { addenda: [], submittals: [], readiness: [], library: [] };

async function loadBidDesk() {
  const box = document.getElementById('bidDesk');
  if (!box) return;
  const res = await adminFetch(`/api/admin/estimates/${id}/bid-desk`);
  if (!res.ok) { box.innerHTML = '<div class="empty-state" style="padding:18px;">Could not load the bid desk.</div>'; return; }
  deskState = await res.json();
  renderBidDesk();
}

function renderBidDesk() {
  const box = document.getElementById('bidDesk');
  if (!box) return;
  const { addenda, submittals, readiness } = deskState;

  const flags = (readiness || []).map(p =>
    `<div class="wage-warn${p.level === 'blocking' ? ' wage-warn-hard' : ''}" style="margin:0 0 10px;">
       ${p.level === 'blocking' ? '<strong>Blocks sending.</strong> ' : ''}${scopeEsc(p.message)}</div>`).join('');

  const addendaRows = !addenda.length
    ? '<p class="scope-blurb" style="margin:0 0 10px;">None recorded. If the agency has issued any, add them &mdash; the bid cannot go out until each is acknowledged.</p>'
    : `<ul class="scope-list">${addenda.map(a => `
        <li class="${a.acknowledged ? '' : 'is-locked'}">
          <span>
            <strong>Addendum ${scopeEsc(a.number)}</strong>${a.receivedAt ? ` &middot; received ${scopeEsc(a.receivedAt)}` : ''}
            ${a.affectsPrice ? ' <em style="font-style:normal; color:#96650B;">&middot; changed the scope</em>' : ''}
            ${a.summary ? `<br><span style="color:#8A98AC; font-size:0.82rem;">${scopeEsc(a.summary)}</span>` : ''}
          </span>
          <span style="flex:none; white-space:nowrap;">
            ${a.acknowledged
              ? `<span class="scope-lock" style="background:#E1F7E8; color:#1B7A3C;">Acknowledged</span>
                 <button type="button" class="scope-btn scope-btn-off" onclick="deskPost({action:'unacknowledge-addendum', id:${a.id}})">Undo</button>`
              : `<button type="button" class="scope-btn" onclick="deskPost({action:'acknowledge-addendum', id:${a.id}})">Acknowledge</button>`}
            <button type="button" class="scope-btn scope-btn-off" onclick="deskPost({action:'remove-addendum', id:${a.id}})">&times;</button>
          </span>
        </li>`).join('')}</ul>`;

  const submittalRows = !submittals.length
    ? `<p class="scope-blurb" style="margin:0 0 10px;">No checklist yet.
       <button type="button" class="scope-btn" onclick="deskPost({action:'seed-submittals'})">Start one from the standard list</button></p>`
    : `<ul class="scope-list">${submittals.map(s => `
        <li class="${s.provided ? '' : s.required ? 'is-locked' : ''}">
          <span>
            <label style="display:flex; gap:8px; align-items:flex-start; cursor:pointer;">
              <input type="checkbox" ${s.provided ? 'checked' : ''} style="margin-top:3px;"
                onchange="deskPost({action:'set-submittal', id:${s.id}, provided:this.checked})">
              <span>
                <strong style="${s.provided ? 'color:#1B7A3C;' : ''}">${scopeEsc(s.label)}</strong>
                ${s.required ? '' : ' <em style="font-style:normal; color:#A0AAB9;">&middot; optional</em>'}
                ${s.note ? `<br><span style="color:#8A98AC; font-size:0.82rem;">${scopeEsc(s.note)}</span>` : ''}
              </span>
            </label>
          </span>
          <button type="button" class="scope-btn scope-btn-off" onclick="deskPost({action:'remove-submittal', id:${s.id}})">&times;</button>
        </li>`).join('')}</ul>`;

  box.innerHTML = flags + `
    <div class="scope-group" style="max-width:660px;">
      <h4>Addenda</h4>
      <p class="scope-blurb">Every amendment the agency issues has to be acknowledged in writing. Failing to is the most common reason a complete bid is thrown out unread &mdash; and any of them may have moved the scope you priced.</p>
      ${addendaRows}
      <div style="display:grid; grid-template-columns:90px 150px 1fr; gap:0 12px; margin-top:10px;">
        <div class="field-group" style="margin-bottom:8px;"><label>Number</label><input type="text" id="addNumber" placeholder="2"></div>
        <div class="field-group" style="margin-bottom:8px;"><label>Received</label><input type="date" id="addReceived"></div>
        <div class="field-group" style="margin-bottom:8px;"><label>What it changed</label><input type="text" id="addSummary" placeholder="e.g. Added the parking structure to the final clean"></div>
      </div>
      <div class="consent-row" style="margin-top:0;">
        <input type="checkbox" id="addAffectsPrice">
        <label for="addAffectsPrice">This one changed the scope, so the price has to be revisited</label>
      </div>
      <button type="button" class="btn btn-primary btn-sm" onclick="addAddendum()">Add addendum</button>
    </div>

    <div class="scope-group" style="max-width:660px;">
      <h4>Submittals</h4>
      <p class="scope-blurb">What goes in the envelope beside the price. Tick each as it is ready. These are a warning rather than a block: the certificate may already be attached to the email, and this app cannot know that.</p>
      ${submittalRows}
      <div class="scope-add">
        <input type="text" id="subLabel" placeholder="Anything else this solicitation asks for"
          style="flex:1; padding:9px 11px; font-size:0.86rem; border:1.5px solid #DCE4EF; border-radius:8px;">
        <button type="button" class="btn btn-primary btn-sm" onclick="addSubmittal()">Add</button>
      </div>
    </div>`;
}

async function deskPost(body) {
  const res = await adminFetch(`/api/admin/estimates/${id}/bid-desk`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { adminToast(data.error || 'Could not save that.'); return false; }
  await loadBidDesk();
  return true;
}

async function addAddendum() {
  const number = document.getElementById('addNumber').value.trim();
  if (!number) { adminToast('Give the addendum its number.'); return; }
  const ok = await deskPost({
    action: 'add-addendum',
    number,
    receivedAt: document.getElementById('addReceived').value || undefined,
    summary: document.getElementById('addSummary').value || undefined,
    affectsPrice: document.getElementById('addAffectsPrice').checked,
  });
  if (ok) adminToast('Addendum recorded. It still needs acknowledging before the bid can go.', 'success');
}

async function addSubmittal() {
  const label = document.getElementById('subLabel').value.trim();
  if (!label) { adminToast('Name the document first.'); return; }
  await deskPost({ action: 'add-submittal', label });
}

/* ---------- How the bid finished ----------
 *
 * Separate from the estimate's status on purpose. Status is what happened to
 * the paperwork; most bids never have anything happen to the paperwork at all.
 * They go quiet, and the job turns up on somebody else's truck.
 */
const OUTCOMES = [
  { v: 'won', l: 'Won' },
  { v: 'lost', l: 'Lost' },
  { v: 'no_bid', l: 'Chose not to bid' },
  { v: 'withdrawn', l: 'Withdrawn' },
];

function renderOutcome(estimate) {
  const box = document.getElementById('outcomePanel');
  if (!box) return;
  const o = estimate.outcome || '';
  const lost = o === 'lost';

  box.innerHTML = `
    <div class="scope-group" style="max-width:660px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 16px;">
        <div class="field-group">
          <label for="outcomeSelect">Outcome</label>
          <select id="outcomeSelect" onchange="renderOutcomeFields()">
            <option value="">Not recorded yet</option>
            ${OUTCOMES.map(x => `<option value="${x.v}"${o === x.v ? ' selected' : ''}>${x.l}</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <label for="bidderCount">Bidders <span style="font-weight:400; color:#8A98AC;">(if known)</span></label>
          <input type="number" id="bidderCount" min="1" max="99" step="1"
            value="${estimate.bidderCount != null ? estimate.bidderCount : ''}" placeholder="e.g. 5">
        </div>
      </div>
      <div id="lossFields" style="display:${lost ? 'grid' : 'none'}; grid-template-columns:1fr 1fr; gap:0 16px;">
        <div class="field-group">
          <label for="lostToName">Who took it</label>
          <input type="text" id="lostToName" value="${scopeEsc(estimate.lostToName || '')}" placeholder="e.g. Wasatch Facility Services">
        </div>
        <div class="field-group">
          <label for="lostToAmount">Their number ($)</label>
          <input type="number" id="lostToAmount" min="0" step="0.01"
            value="${estimate.lostToAmount != null ? estimate.lostToAmount : ''}" placeholder="the figure that won">
          <p style="font-size:0.76rem; color:#8A98AC; margin-top:4px;">Public awards are published. On private work, ask &mdash; a GC who liked you will often say.</p>
        </div>
      </div>
      <div class="field-group">
        <label for="outcomeNotes">What actually decided it</label>
        <textarea id="outcomeNotes" rows="2" placeholder="e.g. Price was close but they had the school district already. Or: we were non-responsive, missed the addendum acknowledgment.">${scopeEsc(estimate.outcomeNotes || '')}</textarea>
      </div>
      <p class="error-text" id="outcomeError"></p>
      <button type="button" class="btn btn-primary btn-sm" onclick="saveOutcome()">Save outcome</button>
      ${o ? ' <button type="button" class="btn btn-sm" style="color:#C0392B;" onclick="clearOutcome()">Clear</button>' : ''}
      ${estimate.outcomeAt ? `<p style="font-size:0.78rem; color:#8A98AC; margin:10px 0 0;">Recorded ${new Date(estimate.outcomeAt).toLocaleDateString()}.</p>` : ''}
    </div>`;
}

/** Only a loss has a competitor, so only a loss asks for one. */
function renderOutcomeFields() {
  const lost = document.getElementById('outcomeSelect').value === 'lost';
  document.getElementById('lossFields').style.display = lost ? 'grid' : 'none';
}

async function saveOutcome() {
  const err = document.getElementById('outcomeError');
  err.textContent = ''; err.classList.remove('show');
  const outcome = document.getElementById('outcomeSelect').value;
  if (!outcome) { err.textContent = 'Pick an outcome, or use Clear to unset it.'; err.classList.add('show'); return; }

  const res = await adminFetch(`/api/admin/estimates/${id}/outcome`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      outcome,
      lostToName: document.getElementById('lostToName')?.value || undefined,
      lostToAmount: document.getElementById('lostToAmount')?.value || undefined,
      bidderCount: document.getElementById('bidderCount')?.value || undefined,
      outcomeNotes: document.getElementById('outcomeNotes')?.value || undefined,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { err.textContent = data.error || 'Could not save that.'; err.classList.add('show'); return; }
  adminToast('Outcome recorded.', 'success');
  load();
}

async function clearOutcome() {
  if (!(await adminConfirm('Clear the recorded outcome for this bid?', 'Clear'))) return;
  const res = await adminFetch(`/api/admin/estimates/${id}/outcome`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ outcome: null }),
  });
  if (!res.ok) { adminToast('Could not clear it.'); return; }
  load();
}

/* ---------- Scope, exclusions and clarifications ----------
 *
 * The service library supplies the standard terms. This is where a bid says
 * the things the library cannot know, and removes the things that do not apply
 * to it. Both matter: an unremovable exclusion about exterior surfaces on a bid
 * that includes exteriors makes the document contradict itself, and a proposal
 * that can only say boilerplate reads like a template because it is one.
 */
const SCOPE_KINDS = [
  {
    kind: 'clarification',
    title: 'Specific to this project',
    blurb: 'The sentences that settle an argument later. Released floor by floor, parking structure excluded, overspray is the painter’s. These print above the standard exclusions, because they are the ones a GC’s estimator actually needs to read.',
    placeholder: 'e.g. Building is released floor by floor; this bid prices three mobilizations.',
    hasLibrary: false,
  },
  {
    kind: 'scope',
    title: 'Extra scope',
    blurb: 'Work included in this price that the service library does not describe.',
    placeholder: 'e.g. Elevator cab interiors detailed and protective pads removed.',
    hasLibrary: true,
  },
  {
    kind: 'exclusion',
    title: 'Exclusions',
    blurb: 'Standard exclusions come from the services quoted. Remove one that does not apply to this job, or add one that does.',
    placeholder: 'e.g. Exterior glass above the second floor is excluded from this bid.',
    hasLibrary: true,
  },
  {
    kind: 'assumption',
    title: 'Assumptions',
    blurb: 'What has to be true on the service date for this price to hold.',
    placeholder: 'e.g. Permanent power and a working freight elevator are available on each released floor.',
    hasLibrary: true,
  },
];

let scopeState = { custom: [], library: null };

const scopeEsc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

/*
 * Exclusions that cannot come off a bid, mirrored from scopeLibrary.mts.
 *
 * Duplicated deliberately rather than fetched: this only decides whether to
 * draw a button, and the server refuses the write regardless. Getting the two
 * out of step shows a button that then fails, which is a bad afternoon --
 * never a bid that went out missing the line.
 */
const PROTECTED_EXCLUSION_PATTERNS = [
  /cleaning contractor/i,
  /no trade work|trade work\b/i,
  /hazardous|asbestos|lead paint|mold|biohazard/i,
  /trade licen[cs]e/i,
];
const isProtectedExclusion = (line) => PROTECTED_EXCLUSION_PATTERNS.some(re => re.test(line));

/** Library lines of one kind, flattened out of the composed document. */
function libraryLines(kind) {
  const lib = scopeState.library;
  if (!lib) return [];
  if (kind === 'exclusion') return lib.exclusions || [];
  if (kind === 'assumption') return lib.assumptions || [];
  if (kind === 'scope') return (lib.sections || []).flatMap(s => s.scope || []);
  return [];
}

async function loadScope() {
  const box = document.getElementById('scopeEditor');
  if (!box) return;
  const res = await adminFetch(`/api/admin/estimates/${id}/scope`);
  if (!res.ok) { box.innerHTML = '<div class="empty-state" style="padding:18px;">Could not load the scope.</div>'; return; }
  const data = await res.json();
  scopeState = { custom: data.custom || [], library: data.library || null };
  renderScope();
}

function renderScope() {
  const box = document.getElementById('scopeEditor');
  if (!box) return;

  box.innerHTML = SCOPE_KINDS.map(k => {
    const added = scopeState.custom.filter(c => c.kind === k.kind && !c.suppress);
    const hidden = new Set(scopeState.custom.filter(c => c.kind === k.kind && c.suppress)
      .map(c => c.text.trim().replace(/\s+/g, ' ').toLowerCase()));
    const lib = libraryLines(k.kind);

    const libHtml = !k.hasLibrary || !lib.length ? '' : `
      <div class="scope-sub">From the service library</div>
      <ul class="scope-list">${lib.map(line => {
        const off = hidden.has(line.trim().replace(/\s+/g, ' ').toLowerCase());
        const row = scopeState.custom.find(c => c.kind === k.kind && c.suppress
          && c.text.trim().replace(/\s+/g, ' ').toLowerCase() === line.trim().replace(/\s+/g, ' ').toLowerCase());
        const locked = k.kind === 'exclusion' && isProtectedExclusion(line);
        return `<li class="${off ? 'is-off' : ''}${locked ? ' is-locked' : ''}">
          <span>${scopeEsc(line)}</span>
          ${locked
            ? '<span class="scope-lock" title="This is what says Renovo is a cleaning contractor and holds no trade licence. Removing it invites work we cannot insure.">Always on</span>'
            : off
              ? `<button type="button" class="scope-btn" onclick="restoreScope(${row ? row.id : 0})">Put back</button>`
              : `<button type="button" class="scope-btn scope-btn-off" onclick="suppressScope('${k.kind}', this)" data-line="${scopeEsc(line)}">Not on this bid</button>`}
        </li>`;
      }).join('')}</ul>`;

    const addedHtml = !added.length ? '' : `
      <div class="scope-sub">${k.hasLibrary ? 'Added for this bid' : 'On this bid'}</div>
      <ul class="scope-list">${added.map(c => `
        <li class="is-custom">
          <span>${scopeEsc(c.text)}</span>
          <button type="button" class="scope-btn" onclick="removeScope(${c.id})">Remove</button>
        </li>`).join('')}</ul>`;

    return `
      <div class="scope-group">
        <h4>${k.title}</h4>
        <p class="scope-blurb">${k.blurb}</p>
        ${libHtml}
        ${addedHtml}
        <div class="scope-add">
          <textarea id="scopeInput-${k.kind}" rows="2" placeholder="${scopeEsc(k.placeholder)}"></textarea>
          <button type="button" class="btn btn-primary btn-sm" onclick="addScope('${k.kind}')">Add</button>
        </div>
      </div>`;
  }).join('');
}

async function postScope(body) {
  const res = await adminFetch(`/api/admin/estimates/${id}/scope`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { adminToast(data.error || 'Could not save that line.'); return false; }
  await loadScope();
  return true;
}

async function addScope(kind) {
  const el = document.getElementById(`scopeInput-${kind}`);
  const text = (el.value || '').trim();
  if (!text) { adminToast('Write the statement first.'); return; }
  if (await postScope({ kind, text })) el.value = '';
}

/*
 * Suppressing sends the library's exact wording, which is what the composer
 * matches against. If the library is later reworded the match stops working
 * and the line comes back -- deliberately, since a stale suppression should
 * cost a conversation rather than silently strip protection out of a document
 * that has already been signed.
 */
async function suppressScope(kind, btn) {
  await postScope({ kind, text: btn.getAttribute('data-line'), suppress: true });
}

async function removeScope(lineId) {
  const res = await adminFetch(`/api/admin/estimates/${id}/scope/${lineId}`, { method: 'DELETE' });
  if (!res.ok) { adminToast('Could not remove that line.'); return; }
  loadScope();
}

const restoreScope = removeScope;   // putting a library line back is deleting its suppression

async function loadPhotos() {
  const box = document.getElementById('estPhotos');
  if (!box) return;
  const res = await adminFetch(`/api/admin/estimates/${id}/photos`);
  if (!res.ok) { box.innerHTML = '<p style="color:#C0392B; font-size:0.85rem;">Could not load photos.</p>'; return; }
  const { photos } = await res.json();

  const thumbs = photos.map(p => `
    <div class="photo-thumb-wrap" style="position:relative;">
      <img src="/api/estimate-photos/${p.token}" class="photo-thumb" alt="${p.caption ? escapeAttr(p.caption) : 'Walk-through photo'}">
      <button type="button" onclick="deletePhoto(${p.id})" title="Remove"
        style="position:absolute; top:4px; right:4px; background:rgba(13,31,56,0.75); color:#fff; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:0.8rem; line-height:1;">&#10005;</button>
      <input type="text" value="${p.caption ? escapeAttr(p.caption) : ''}" placeholder="Add a caption…"
        onchange="saveCaption(${p.id}, this.value)"
        style="width:100%; margin-top:5px; font-size:0.76rem; padding:5px 7px; border:1px solid #DCE4EF; border-radius:5px;">
    </div>`).join('');

  const atCap = photos.length >= MAX_PROPOSAL_PHOTOS;
  box.innerHTML = `
    ${photos.length ? `<div class="photo-grid">${thumbs}</div>` : '<p style="color:#8A98AC; font-size:0.85rem;">No photos yet.</p>'}
    <button type="button" class="btn btn-outline btn-sm" ${atCap ? 'disabled' : ''}
      style="color:var(--navy); border-color:var(--navy); margin-top:10px;" onclick="uploadPhoto()">+ Add Photo</button>
    <span style="color:#8A98AC; font-size:0.78rem; margin-left:10px;">${photos.length} of ${MAX_PROPOSAL_PHOTOS}${atCap ? ' — remove one to add another' : ''}</span>`;
}

function escapeAttr(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function uploadPhoto() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  // Walk-throughs happen on a phone, so open the camera rather than the gallery.
  input.capture = 'environment';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const dataUrl = await resizeImageFile(file);
      const res = await adminFetch(`/api/admin/estimates/${id}/photos`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dataUrl }),
      });
      if (res.ok) { loadPhotos(); return; }
      const data = await res.json().catch(() => ({}));
      adminToast(data.error || 'Failed to upload photo.');
    } catch (err) {
      adminToast('Could not process that image.');
    }
  };
  input.click();
}

async function saveCaption(photoId, caption) {
  const res = await adminFetch(`/api/admin/estimates/${id}/photos/${photoId}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caption }),
  });
  if (!res.ok) adminToast('Failed to save caption.');
}

async function deletePhoto(photoId) {
  if (!(await adminConfirm('Remove this photo from the proposal?', 'Remove'))) return;
  const res = await adminFetch(`/api/admin/estimates/${id}/photos/${photoId}`, { method: 'DELETE' });
  if (res.ok) loadPhotos(); else adminToast('Failed to remove photo.');
}

async function sendEstimate() {
  const btn = document.getElementById('sendEstimateBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await adminFetch(`/api/admin/estimates/${id}/send`, { method: 'POST' });
    if (res.ok) { load(); return; }
    adminToast('Failed to send estimate.');
  } catch (err) {
    adminToast('Failed to send estimate. Please check your connection and try again.');
  }
  btn.disabled = false;
  btn.textContent = 'Send to Client';
}

async function convertToWorkOrder() {
  const btn = document.getElementById('convertBtn');
  btn.disabled = true;
  btn.textContent = 'Converting…';
  try {
    const res = await adminFetch(`/api/admin/estimates/${id}/convert`, { method: 'POST' });
    if (res.ok) { load(); return; }
    adminToast('Failed to convert to work order.');
  } catch (err) {
    adminToast('Failed to convert to work order. Please check your connection and try again.');
  }
  btn.disabled = false;
  btn.textContent = 'Convert to Work Order';
}

async function archiveEstimate(archived) {
  const res = await adminFetch(`/api/admin/estimates/${id}/archive`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived })
  });
  if (res.ok) load(); else adminToast('Failed to update estimate.');
}

load();
</script>
