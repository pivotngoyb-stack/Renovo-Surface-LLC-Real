<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimate Detail | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <div class="container">
      <img src="../images/logo.png" alt="Renovo">
      <div style="display:flex; gap:24px; align-items:center;">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/schedule.html">Schedule</a>
        <a href="/admin/contracts.html">Contracts</a>
        <a href="/admin/work-orders.html">Work Orders</a>
        <a href="/admin/subcontractors.html">Subcontractors</a>
        <a href="/admin/documents.html">Documents</a>
        <a href="/admin/estimate-new.html">+ New Estimate</a>
        <a href="/admin/invoice-new.html">+ New Invoice</a>
        <button onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="admin-wrap" style="max-width:720px;">
    <a href="/admin/dashboard.html" style="color:var(--blue); font-size:0.9rem;">&larr; Back to Dashboard</a>
    <div id="content" style="margin-top:20px;">Loading…</div>
  </div>

<script src="../js/admin.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');

async function load() {
  const res = await adminFetch(`/api/admin/estimates/${id}`);
  if (!res.ok) { document.getElementById('content').innerHTML = '<div class="empty-state">Estimate not found.</div>'; return; }
  const { estimate, client, lineItems, workOrder, invoice } = await res.json();

  const total = lineItems.reduce((sum, li) => sum + Number(li.quantity) * Number(li.unitPrice), 0);
  const itemsHtml = lineItems.map(li => `
    <tr><td>${li.description}</td><td>${li.quantity}</td><td>${money(li.unitPrice)}</td><td>${money(li.quantity * li.unitPrice)}</td></tr>
  `).join('');

  const estimateLink = `${window.location.origin}/estimate.html?t=${estimate.token}`;

  let actions = '';
  if (estimate.status === 'draft') {
    actions = `<button class="btn btn-primary" id="sendEstimateBtn" onclick="sendEstimate()">Send to Client</button>`;
  } else if (estimate.status === 'approved' && !workOrder) {
    actions = `<button class="btn btn-primary" id="convertBtn" onclick="convertToWorkOrder()">Convert to Work Order</button>`;
  }

  let workOrderSection = '';
  if (workOrder) {
    const woLink = `${window.location.origin}/work-order.html?t=${workOrder.token}`;
    let invoiceHtml = '';
    if (invoice) {
      const invLink = `${window.location.origin}/invoice.html?t=${invoice.token}`;
      invoiceHtml = `
        <h3 style="margin:28px 0 12px;">Invoice</h3>
        <p>Status: ${statusPill(invoice.status)}</p>
        <p style="margin-top:10px; font-size:0.85rem;"><a href="${invLink}" target="_blank">${invLink}</a></p>
        <p style="margin-top:10px;"><a href="/admin/invoice-detail.html?id=${invoice.id}" class="btn btn-primary btn-sm">Manage Invoice</a></p>
      `;
    } else if (workOrder.status === 'signed') {
      invoiceHtml = `<div style="margin-top:20px;"><a href="/admin/invoice-new.html?workOrderId=${workOrder.id}" class="btn btn-primary btn-sm">Create Invoice</a></div>`;
    }
    workOrderSection = `
      <h3 style="margin:28px 0 12px;">Work Order</h3>
      <p>Status: ${statusPill(workOrder.status)}</p>
      <p style="margin-top:10px; font-size:0.85rem;"><a href="${woLink}" target="_blank">${woLink}</a></p>
      <p style="margin-top:10px;"><a href="/admin/work-order-detail.html?id=${workOrder.id}" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy);">View Work Order Details</a></p>
      ${invoiceHtml}
    `;
  }

  document.getElementById('content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
      <div>
        <h1 style="font-size:1.6rem;">Estimate #${estimate.id}</h1>
        <p style="color:#8A98AC;">${client?.name || ''} &middot; ${client?.email || ''}</p>
      </div>
      <div style="text-align:right;">
        ${statusPill(estimate.status)}
        <div style="margin-top:10px;">
          <button class="btn btn-sm" style="color:${estimate.archived ? '#1B7A3C' : '#C0392B'};" onclick="archiveEstimate(${!estimate.archived})">${estimate.archived ? 'Unarchive' : 'Archive'}</button>
        </div>
      </div>
    </div>

    <table class="dash-table">
      <thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
      <tbody>${itemsHtml}</tbody>
    </table>
    ${estimate.taxApplied ? `<div class="totals-row" style="font-size:0.9rem; color:#4A5A72;">Subtotal: ${money(total)}</div><div class="totals-row" style="font-size:0.9rem; color:#4A5A72;">Utah Sales Tax (7.25%): ${money(estimate.taxAmount)}</div>` : ''}
    <div class="totals-row">Total: ${money(total + Number(estimate.taxAmount || 0))}</div>

    ${estimate.notes ? `<p style="margin-top:16px; color:#4A5A72;"><strong>Notes:</strong> ${estimate.notes}</p>` : ''}
    ${estimate.validUntil ? `<p style="color:#4A5A72;"><strong>Valid Until:</strong> ${estimate.validUntil}</p>` : ''}

    <p style="margin-top:20px; font-size:0.85rem; word-break:break-all;"><strong>Client link:</strong> <a href="${estimateLink}" target="_blank">${estimateLink}</a></p>

    <h3 style="margin:28px 0 6px;">Walk-Through Photos</h3>
    <p style="color:#8A98AC; font-size:0.82rem; margin-bottom:12px;">
      These appear on the client proposal as documented site conditions. They are what settles a scope
      argument later, so photograph what the price assumes: soil load, access, anything already damaged.
    </p>
    <div id="estPhotos"></div>

    <div style="margin-top:24px;">${actions}</div>
    ${workOrderSection}
  `;

  loadPhotos();
}

const MAX_PROPOSAL_PHOTOS = 12;

async function loadPhotos() {
  const box = document.getElementById('estPhotos');
  if (!box) return;
  const res = await adminFetch(`/api/admin/estimates/${id}/photos`);
  if (!res.ok) { box.innerHTML = '<p style="color:#C0392B; font-size:0.85rem;">Could not load photos.</p>'; return; }
  const { photos } = await res.json();

  const thumbs = photos.map(p => `
    <div class="photo-thumb-wrap" style="position:relative;">
      <img src="/api/estimate-photos/${p.token}" class="photo-thumb" alt="${p.caption ? escapeAttr(p.caption) : 'Walk-through photo'}">
      <button type="button" onclick="deletePhoto(${p.id})" title="Remove"
        style="position:absolute; top:4px; right:4px; background:rgba(13,31,56,0.75); color:#fff; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:0.8rem; line-height:1;">&#10005;</button>
      <input type="text" value="${p.caption ? escapeAttr(p.caption) : ''}" placeholder="Add a caption…"
        onchange="saveCaption(${p.id}, this.value)"
        style="width:100%; margin-top:5px; font-size:0.76rem; padding:5px 7px; border:1px solid #DCE4EF; border-radius:5px;">
    </div>`).join('');

  const atCap = photos.length >= MAX_PROPOSAL_PHOTOS;
  box.innerHTML = `
    ${photos.length ? `<div class="photo-grid">${thumbs}</div>` : '<p style="color:#8A98AC; font-size:0.85rem;">No photos yet.</p>'}
    <button type="button" class="btn btn-outline btn-sm" ${atCap ? 'disabled' : ''}
      style="color:var(--navy); border-color:var(--navy); margin-top:10px;" onclick="uploadPhoto()">+ Add Photo</button>
    <span style="color:#8A98AC; font-size:0.78rem; margin-left:10px;">${photos.length} of ${MAX_PROPOSAL_PHOTOS}${atCap ? ' — remove one to add another' : ''}</span>`;
}

function escapeAttr(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function uploadPhoto() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  // Walk-throughs happen on a phone, so open the camera rather than the gallery.
  input.capture = 'environment';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const dataUrl = await resizeImageFile(file);
      const res = await adminFetch(`/api/admin/estimates/${id}/photos`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dataUrl }),
      });
      if (res.ok) { loadPhotos(); return; }
      const data = await res.json().catch(() => ({}));
      adminToast(data.error || 'Failed to upload photo.');
    } catch (err) {
      adminToast('Could not process that image.');
    }
  };
  input.click();
}

async function saveCaption(photoId, caption) {
  const res = await adminFetch(`/api/admin/estimates/${id}/photos/${photoId}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caption }),
  });
  if (!res.ok) adminToast('Failed to save caption.');
}

async function deletePhoto(photoId) {
  if (!(await adminConfirm('Remove this photo from the proposal?', 'Remove'))) return;
  const res = await adminFetch(`/api/admin/estimates/${id}/photos/${photoId}`, { method: 'DELETE' });
  if (res.ok) loadPhotos(); else adminToast('Failed to remove photo.');
}

async function sendEstimate() {
  const btn = document.getElementById('sendEstimateBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await adminFetch(`/api/admin/estimates/${id}/send`, { method: 'POST' });
    if (res.ok) { load(); return; }
    adminToast('Failed to send estimate.');
  } catch (err) {
    adminToast('Failed to send estimate. Please check your connection and try again.');
  }
  btn.disabled = false;
  btn.textContent = 'Send to Client';
}

async function convertToWorkOrder() {
  const btn = document.getElementById('convertBtn');
  btn.disabled = true;
  btn.textContent = 'Converting…';
  try {
    const res = await adminFetch(`/api/admin/estimates/${id}/convert`, { method: 'POST' });
    if (res.ok) { load(); return; }
    adminToast('Failed to convert to work order.');
  } catch (err) {
    adminToast('Failed to convert to work order. Please check your connection and try again.');
  }
  btn.disabled = false;
  btn.textContent = 'Convert to Work Order';
}

async function archiveEstimate(archived) {
  const res = await adminFetch(`/api/admin/estimates/${id}/archive`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived })
  });
  if (res.ok) load(); else adminToast('Failed to update estimate.');
}

load();
</script>
</body>
</html>
