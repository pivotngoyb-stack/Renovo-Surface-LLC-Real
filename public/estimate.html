<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Estimate | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <div id="content">
    <div class="state-banner"><div class="icon">⏳</div><p>Loading your estimate…</p></div>
  </div>

<script>
const token = new URLSearchParams(window.location.search).get('t');

function money(n) {
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function load() {
  if (!token) { showError('Missing estimate link.'); return; }
  const res = await fetch(`/api/estimate/${token}`);
  if (!res.ok) { showError('This estimate could not be found.'); return; }
  const { estimate, client, lineItems } = await res.json();
  render(estimate, client, lineItems);
}

function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="state-banner"><div class="icon">⚠️</div><p>${msg}</p></div>`;
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d;
}

function fmtDate(d) {
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function render(estimate, client, lineItems) {
  const subtotal = lineItems.reduce((sum, li) => sum + Number(li.quantity) * Number(li.unitPrice), 0);
  const taxAmount = estimate.taxApplied ? Number(estimate.taxAmount) : 0;
  const total = subtotal + taxAmount;

  const issuedDate = new Date(estimate.createdAt);
  const expiresDate = estimate.validUntil ? new Date(estimate.validUntil) : addDays(estimate.createdAt, 30);

  const itemsHtml = lineItems.map((li, idx) => `
    <tr style="background:${idx % 2 === 0 ? '#fff' : 'var(--off-white)'};">
      <td>${li.description}</td>
      <td>${li.quantity}</td>
      <td>${li.unit || 'ea'}</td>
      <td>${money(li.unitPrice)}</td>
      <td style="text-align:right;">${money(li.quantity * li.unitPrice)}</td>
    </tr>
  `).join('');

  let actionsHtml = '';
  if (estimate.status === 'approved') {
    actionsHtml = `<div class="state-banner"><div class="icon">✅</div><p><strong>Your estimate has been approved.</strong> We will contact you within 2 hours to confirm your service date. Thank you for choosing Renovo Surface Solutions.</p></div>`;
  } else if (estimate.status === 'declined') {
    actionsHtml = `<div class="state-banner"><p>You requested changes on this estimate. We'll follow up with you directly.</p></div>`;
  } else {
    actionsHtml = `
      <div class="doc-actions no-print">
        <button class="btn btn-primary" onclick="respond('approve')">Approve This Estimate</button>
        <button class="btn btn-outline" style="color:#6b7280; border-color:#DCE4EF;" onclick="respond('decline')">Request Changes</button>
      </div>
      <p class="no-print" style="text-align:center; color:#4A5A72; font-size:0.85rem; margin-top:14px;">Questions? Call <a href="tel:8013692330" style="color:var(--blue);">801-369-2330</a> or email <a href="mailto:info@renovosurface.com" style="color:var(--blue);">info@renovosurface.com</a></p>
      <p id="respondError" class="error-text no-print" style="text-align:center;"></p>
    `;
  }

  document.getElementById('content').innerHTML = `
    <div class="doc-card" style="max-width:800px;">
      <div class="est-header">
        <div>
          <div class="est-company-name">Renovo Surface Solutions LLC</div>
          <div style="margin-top:10px;">
            <span class="est-label">ESTIMATE</span>
            <span style="color:#8A98AC; font-size:0.9rem; margin-left:8px;">#${estimate.id}</span>
          </div>
          <p style="color:#4A5A72; font-size:0.85rem; margin-top:8px;">Date Issued: ${fmtDate(issuedDate)}<br>Expires: ${fmtDate(expiresDate)}</p>
        </div>
        <div class="est-company-info">
          801-369-2330<br>
          info@renovosurface.com<br>
          renovosurface.com<br>
          30 N Orange Street, Salt Lake City, UT 84116
        </div>
      </div>

      <div class="est-prepared-for">
        <h4>Prepared For</h4>
        <p>
          <strong>${client?.name || ''}</strong>${client?.company ? ` — ${client.company}` : ''}<br>
          ${client?.propertyAddress ? `${client.propertyAddress}<br>` : ''}
          ${client?.phone ? `${client.phone}<br>` : ''}
          ${client?.email || ''}
        </p>
      </div>

      <table class="doc-items-table est-items-table">
        <thead><tr><th>Service Description</th><th>Qty</th><th>Unit</th><th>Rate</th><th style="text-align:right;">Amount</th></tr></thead>
        <tbody>${itemsHtml}</tbody>
      </table>

      <div style="text-align:right; margin-top:16px;">
        <p style="color:#4A5A72;">Subtotal: ${money(subtotal)}</p>
        ${estimate.taxApplied ? `<p style="color:#4A5A72;">Utah Sales Tax (7.25%): ${money(taxAmount)}</p>` : ''}
        <div class="doc-total">TOTAL: ${money(total)}</div>
      </div>

      ${estimate.notes ? `<p style="margin-top:16px; color:#4A5A72;">${estimate.notes}</p>` : ''}

      <div class="estimate-terms-box">
        <h4>Estimate Terms</h4>
        <p>This estimate is valid for 30 days from the date issued. Prices are based on information provided at time of estimate. Final pricing may vary if actual site conditions differ materially. A signed work order is required before any service begins. Approving this estimate does not constitute a signed work order.</p>
      </div>

      <div class="print-btn-row no-print"><button type="button" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy);" onclick="window.print()">🖨️ Print This Estimate</button></div>

      ${actionsHtml}
    </div>
  `;
}

async function respond(action) {
  const res = await fetch(`/api/estimate/${token}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action })
  });
  if (res.ok) {
    load();
  } else {
    document.getElementById('respondError').textContent = 'Something went wrong. Please call 801-369-2330.';
    document.getElementById('respondError').classList.add('show');
  }
}

load();
</script>
</body>
</html>
