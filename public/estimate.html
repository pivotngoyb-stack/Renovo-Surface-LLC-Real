<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Proposal | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <div id="content">
    <div class="state-banner"><div class="icon">⏳</div><p>Loading your proposal…</p></div>
  </div>

<script>
const token = new URLSearchParams(window.location.search).get('t');

function money(n) {
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/** Matches the invoice convention (INV-1000+id) so document numbers read as a set. */
function proposalNumber(id) {
  return 'EST-' + (1000 + Number(id));
}

async function load() {
  if (!token) { showError('Missing proposal link.'); return; }
  const res = await fetch(`/api/estimate/${token}`);
  if (!res.ok) { showError('This proposal could not be found.'); return; }
  const data = await res.json();
  render(data);
}

function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="state-banner"><div class="icon">⚠️</div><p>${msg}</p></div>`;
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d;
}

function fmtDate(d) {
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function esc(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/**
 * Site photographs from the walk-through.
 *
 * A proposal that says "heavy drywall dust throughout" is an assertion. The
 * same proposal with four photographs of it is a record, and it is what stops
 * a scope dispute three weeks later: the client saw the condition the price
 * was based on before they signed.
 *
 * Captions are the useful part, so an uncaptioned photo still gets a number to
 * be cited by.
 */
function photoSectionHtml(photos) {
  if (!photos || !photos.length) return '';
  return `
    <p style="color:#4A5A72; font-size:0.86rem; margin-bottom:12px;">
      Recorded at the walk-through. These document the condition this price is based on.
    </p>
    <div class="prop-photos">
      ${photos.map((p, i) => `
        <figure class="prop-photo">
          <img src="/api/estimate-photos/${esc(p.token)}" alt="${esc(p.caption || ('Site photograph ' + (i + 1)))}" loading="lazy">
          <figcaption><span class="prop-photo-num">${i + 1}</span>${esc(p.caption || 'Site condition at walk-through')}</figcaption>
        </figure>`).join('')}
    </div>`;
}

/**
 * Cover page.
 *
 * A national firm's proposal opens on a title page, not on a line-item table.
 * It answers four questions before the reader turns it over: who is this for,
 * what is it for, when was it issued, and who submitted it.
 *
 * Deliberately no price here. Formal proposals put pricing in the pricing
 * section; a number on the cover invites a buyer to compare on cost before
 * reading the scope, which is the one thing a good bid does not want.
 *
 * Prints as its own sheet, so the document a facility director hands to their
 * board starts the way they expect.
 */
function coverPageHtml(ctx) {
  const { company, client, estimate, issuedDate, expiresDate, government, siteLine } = ctx;

  const row = (label, value) => value
    ? `<div class="cover-row"><span class="cover-row-label">${label}</span><span class="cover-row-value">${value}</span></div>`
    : '';

  const clientLine = [
    client && client.company ? esc(client.company) : '',
    client && client.name ? esc(client.name) : '',
  ].filter(Boolean);

  return `
    <div class="doc-card cover-page">
      <div class="cover-brand">
        <img src="images/logo.png" alt="" class="cover-logo">
        <div>
          <div class="cover-company">${esc(company.legalName)}</div>
          <div class="cover-tagline">${esc(company.tagline)}</div>
        </div>
      </div>

      <div class="cover-middle">
        <div class="cover-kicker">Proposal for Commercial Cleaning Services</div>
        <h1 class="cover-title">${esc(estimate.projectName || (client && client.company) || 'Service Proposal')}</h1>
        ${siteLine ? `<div class="cover-site">${esc(siteLine)}</div>` : ''}
      </div>

      <div class="cover-blocks">
        <div class="cover-block">
          <h4>Prepared for</h4>
          <p>
            ${clientLine.length ? clientLine.join('<br>') : esc(client && client.name)}
            ${client && client.propertyAddress ? `<br>${esc(client.propertyAddress)}` : ''}
          </p>
        </div>
        <div class="cover-block">
          <h4>Submitted by</h4>
          <p>
            ${esc(company.legalName)}<br>
            ${esc(company.owner)}, ${esc(company.ownerTitle)}<br>
            ${esc(company.addressLine)}<br>
            ${esc(company.city)}, ${esc(company.state)} ${esc(company.zip)}<br>
            ${esc(company.phone)} &middot; ${esc(company.email)}
          </p>
        </div>
      </div>

      <div class="cover-facts">
        ${row('Proposal number', proposalNumber(estimate.id))}
        ${row('Date issued', fmtDate(issuedDate))}
        ${row('Valid through', fmtDate(expiresDate))}
        ${estimate.walkthroughDate ? row('Site walk-through', fmtDate(new Date(estimate.walkthroughDate + 'T12:00:00'))) : ''}
        ${government && government.solicitationNumber ? row('Solicitation', esc(government.solicitationNumber)) : ''}
        ${row('NAICS', esc(company.naics) + ' &mdash; ' + esc(company.naicsLabel))}
        ${government && government.company && government.company.uei ? row('UEI', esc(government.company.uei)) : ''}
        ${government && government.company && government.company.cage ? row('CAGE', esc(government.company.cage)) : ''}
      </div>

      <div class="cover-foot">
        ${esc(company.entityType)} organised in ${esc(company.stateOfFormation)} &middot; Serving ${esc(company.serviceArea)} &middot; ${esc(company.website)}
      </div>
    </div>`;
}

/** One numbered section of the bid. Numbers let a client cite "exclusion 3". */
function section(num, title, body) {
  return `<div class="prop-section">
    <h3><span class="prop-num">${num}</span>${title}</h3>
    ${body}
  </div>`;
}

function bulletList(items, extraClass) {
  return `<ul class="prop-list${extraClass ? ' ' + extraClass : ''}">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
}

function itemRows(items) {
  return items.map(li => `
    <tr>
      <td>${esc(li.description)}</td>
      <td>${esc(li.quantity)}</td>
      <td>${esc(li.unit || 'job')}</td>
      <td>${money(li.unitPrice)}</td>
      <td style="text-align:right;">${money(Number(li.quantity) * Number(li.unitPrice))}</td>
    </tr>`).join('');
}

const DAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/**
 * The service schedule matrix. Standard on every professional janitorial
 * proposal: a grid showing what happens on which day, so a facility manager
 * can see the service pattern without reading the pricing table twice.
 */
function scheduleMatrixHtml(schedule) {
  if (!schedule || !schedule.hasAny) return '';
  const grid = schedule.weekly.length ? `
    <div class="prop-scroll"><table class="sched-matrix">
      <thead><tr><th>Service</th>${DAY_LABELS.map(d => `<th>${d}</th>`).join('')}<th>Frequency</th></tr></thead>
      <tbody>${schedule.weekly.map(r => `<tr>
        <td>${esc(r.service)}</td>
        ${r.days.map(on => `<td class="sched-cell${on ? ' is-on' : ''}">${on ? '&#10003;' : ''}</td>`).join('')}
        <td class="sched-freq">${esc(r.frequencyLabel)}</td>
      </tr>`).join('')}</tbody>
    </table></div>` : '';

  const periodic = schedule.periodic.length ? `
    <h4 style="margin:16px 0 8px; font-size:0.9rem; color:var(--navy);">Periodic services</h4>
    <ul class="prop-list">${schedule.periodic.map(r =>
      `<li>${esc(r.service)} — <strong>${esc(r.frequencyLabel)}</strong> (${r.visitsPerYear} per year)</li>`).join('')}</ul>` : '';

  return grid + periodic +
    '<p style="color:#8A98AC; font-size:0.8rem; margin-top:10px;">Day pattern shown is proposed. Final service days are confirmed with your site contact before the first visit.</p>';
}

/** Annual contract value. A recurring bid is not comparable without it. */
function contractValueHtml(contract) {
  if (!contract || !contract.hasRecurring) return '';
  return `
    <div class="prop-acv">
      <div class="prop-acv-row"><span>Recurring services, per month (average)</span><strong>${money(contract.monthlyAverage)}</strong></div>
      ${contract.oneTimeTotal > 0 ? `<div class="prop-acv-row"><span>One-time services (first year only)</span><strong>${money(contract.oneTimeTotal)}</strong></div>` : ''}
      <div class="prop-acv-row is-total"><span>Annual contract value</span><strong>${money(contract.annualRecurring)}</strong></div>
      ${contract.oneTimeTotal > 0 ? `<div class="prop-acv-row"><span>Total, first year</span><strong>${money(contract.firstYearTotal)}</strong></div>` : ''}
    </div>`;
}

/** Per-property subtotals for portfolio proposals. */
function siteBreakdownHtml(sites, discountPct) {
  if (!sites || sites.length < 2) return '';
  const total = sites.reduce((sum, g) => sum + g.subtotal, 0);
  const discount = discountPct > 0 ? total * (discountPct / 100) : 0;
  return `
    <div class="prop-scroll"><table class="doc-items-table est-items-table">
      <thead><tr><th>Property</th><th>Services</th><th style="text-align:right;">Subtotal</th></tr></thead>
      <tbody>${sites.map(g => `<tr>
        <td><strong>${esc(g.siteName)}</strong></td>
        <td>${g.lines.filter(l => !l.isOptional).length}</td>
        <td style="text-align:right;">${money(g.subtotal)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    ${discount > 0 ? `<div class="prop-totals">
      <div class="prop-totals-line">Portfolio total across ${sites.length} properties: ${money(total)}</div>
      <div class="prop-totals-line" style="color:#1B7A3C;">Multi-property discount (${discountPct}%): −${money(discount)}</div>
    </div>` : ''}`;
}

/** Opening paragraph. A director with fifteen bids reads this and the total. */
function executiveSummaryHtml(summary) {
  if (!summary || !summary.length) return '';
  return summary.map(p => `<p style="color:#374151; font-size:0.92rem; line-height:1.75; margin-bottom:10px;">${esc(p)}</p>`).join('');
}

/**
 * Base year plus option years. Agencies price renewals separately so they
 * can extend without re-bidding, and they expect escalation stated openly.
 */
function multiYearHtml(my) {
  if (!my || !my.hasOptionYears) return '';
  return `
    <div class="prop-scroll"><table class="doc-items-table est-items-table">
      <thead><tr><th>Contract Period</th><th style="text-align:right;">Annual Value</th></tr></thead>
      <tbody>${my.years.map(y => `<tr>
        <td>${esc(y.label)}${y.isBase ? ' <span style="color:#8A98AC; font-size:0.8rem;">(includes any one-time work)</span>' : ''}</td>
        <td style="text-align:right;">${money(y.annualValue)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="prop-acv">
      <div class="prop-acv-row"><span>Annual escalation applied to option years</span><strong>${my.escalationPct}%</strong></div>
      <div class="prop-acv-row is-total"><span>Total contract value, all periods</span><strong>${money(my.totalContractValue)}</strong></div>
    </div>`;
}

/**
 * Vendor registration. Contracting officers screen this before price, and a
 * bid missing a NAICS or UEI is often non-responsive on its face. Anything
 * not yet held is shown as pending rather than omitted or invented.
 */
function registrationHtml(gov) {
  if (!gov) return '';
  const rows = gov.registration.map(r => `<tr>
    <td style="width:230px;"><strong>${esc(r.label)}</strong></td>
    <td>${esc(r.value)}${r.held ? '' : ' <span style="color:#966A00; font-size:0.8rem;">(pending)</span>'}</td>
  </tr>`).join('');
  const wage = gov.prevailingWageStatements.length
    ? `<h4 style="margin:18px 0 8px; font-size:0.9rem; color:var(--navy);">Prevailing Wage &amp; Certified Payroll</h4>${bulletList(gov.prevailingWageStatements)}`
    : '';
  return `<div class="prop-scroll"><table class="doc-items-table est-items-table"><tbody>${rows}</tbody></table></div>${wage}`;
}

function render(data) {
  const { estimate, client, lineItems, proposal, contract, schedule, sites, portfolioDiscountPct, summary, government, company, photos, deposit, expiresOn, expired } = data;

  // Optional lines are alternates the client may accept or decline. They are
  // deliberately kept out of the headline total so the base price stays
  // directly comparable against a competing bid.
  const baseItems = lineItems.filter(li => !li.isOptional);
  const optionalItems = lineItems.filter(li => li.isOptional);

  const lineTotal = (li) => Number(li.quantity) * Number(li.unitPrice);
  const subtotal = baseItems.reduce((sum, li) => sum + lineTotal(li), 0);
  const optionalTotal = optionalItems.reduce((sum, li) => sum + lineTotal(li), 0);
  const taxAmount = estimate.taxApplied ? Number(estimate.taxAmount) : 0;
  const total = subtotal + taxAmount;

  const issuedDate = new Date(estimate.createdAt);
  const expiresDate = expiresOn
    ? new Date(expiresOn + 'T12:00:00')
    : (estimate.validUntil ? new Date(estimate.validUntil) : addDays(estimate.createdAt, 30));

  const profile = company || (government && government.company) || null;
  const scope = proposal || { sections: [], exclusions: [], assumptions: [], compliance: [] };

  // Sections 2 and 3 only appear on recurring or multi-site bids, so the
  // numbering has to shift rather than leave gaps a client would notice.
  // Section 1 is the executive summary when present; everything else follows.
  let sectionNo = summary && summary.length ? 1 : 0;
  const nextNum = () => `${++sectionNo}.`;

  /* ---------- 1. Scope of work ---------- */
  const scopeBody = scope.sections.length
    ? scope.sections.map(sec => `
        <div class="prop-scope-group">
          <h4>${esc(sec.label)}</h4>
          ${bulletList(sec.scope)}
        </div>`).join('')
    : `<p style="color:#4A5A72;">Scope as described in the line items below.</p>`;

  /* ---------- 2. Pricing ---------- */
  const optionalBlock = optionalItems.length ? `
    <div class="prop-optional-head">Optional — Not Included in the Total Above</div>
    <p class="prop-optional-note">Priced for your consideration. Tell us which, if any, you want and we will add them to the work order. Declining them does not change the price above.</p>
    <div class="prop-scroll"><table class="doc-items-table est-items-table prop-items-optional">
      <thead><tr><th>Service Description</th><th>Qty</th><th>Unit</th><th>Rate</th><th style="text-align:right;">Amount</th></tr></thead>
      <tbody>${itemRows(optionalItems)}</tbody>
    </table></div>
    <div class="prop-totals"><div class="prop-totals-line">If all options accepted, add: <strong>${money(optionalTotal)}</strong></div></div>
  ` : '';

  const pricingBody = `
    <div class="prop-scroll"><table class="doc-items-table est-items-table">
      <thead><tr><th>Service Description</th><th>Qty</th><th>Unit</th><th>Rate</th><th style="text-align:right;">Amount</th></tr></thead>
      <tbody>${itemRows(baseItems)}</tbody>
    </table></div>
    <div class="prop-totals">
      <div class="prop-totals-line">Subtotal: ${money(subtotal)}</div>
      ${estimate.taxApplied ? `<div class="prop-totals-line">Utah Sales Tax (7.25%): ${money(taxAmount)}</div>` : ''}
      <div class="prop-grand">TOTAL: ${money(total)}</div>
    </div>
    ${deposit && deposit.required ? `
      <div class="prop-deposit">
        <div class="prop-deposit-row"><span>Deposit due now (${deposit.pct}%)</span><strong>${money(deposit.depositDue)}</strong></div>
        <div class="prop-deposit-row"><span>Balance due at completion</span><strong>${money(deposit.balanceDue)}</strong></div>
        <p class="prop-deposit-note">A deposit is required to schedule and hold the crew for this project. The balance is due on completion and walk-through sign-off.</p>
      </div>` : ''}
    ${optionalBlock}
  `;

  /* ---------- action state ---------- */
  let actionsHtml = '';
  if (estimate.status === 'approved') {
    actionsHtml = `<div class="state-banner"><div class="icon">✅</div><p><strong>This proposal has been accepted.</strong> We will contact you within 2 hours to confirm your service date. Thank you for choosing Renovo Surface Solutions.</p></div>`;
  } else if (expired) {
    actionsHtml = `<div class="state-banner"><p><strong>This proposal expired on ${fmtDate(expiresDate)}.</strong> Pricing moves with material and fuel costs, so we would rather re-quote than hold you to an old number. Call <a href="tel:8013692330" style="color:var(--blue);">801-369-2330</a> or email <a href="mailto:info@renovosurface.com" style="color:var(--blue);">info@renovosurface.com</a> and we will send you an updated proposal.</p></div>`;
  } else if (estimate.status === 'declined') {
    actionsHtml = `<div class="state-banner"><p>You requested changes on this proposal. We'll follow up with you directly.</p></div>`;
  } else {
    actionsHtml = `
      <div class="doc-actions no-print">
        <button class="btn btn-primary" onclick="respond('approve')">Accept This Proposal</button>
        <button class="btn btn-outline" style="color:#6b7280; border-color:#DCE4EF;" onclick="respond('decline')">Request Changes</button>
      </div>
      <p class="no-print" style="text-align:center; color:#4A5A72; font-size:0.85rem; margin-top:14px;">Questions? Call <a href="tel:8013692330" style="color:var(--blue);">801-369-2330</a> or email <a href="mailto:info@renovosurface.com" style="color:var(--blue);">info@renovosurface.com</a></p>
      <p id="respondError" class="error-text no-print" style="text-align:center;"></p>
    `;
  }

  const siteLine = estimate.siteAddress || (client && client.propertyAddress) || '';
  const coverHtml = profile
    ? coverPageHtml({ company: profile, client, estimate, issuedDate, expiresDate, government, siteLine })
    : '';

  document.getElementById('content').innerHTML = `
    ${coverHtml}
    <div class="doc-card" style="max-width:840px;">
      <div class="est-header">
        <div>
          <div class="est-company-name">Renovo Surface Solutions LLC</div>
          <div style="margin-top:10px;">
            <span class="est-label">PROPOSAL</span>
            <span style="color:#8A98AC; font-size:0.9rem; margin-left:8px;">${proposalNumber(estimate.id)}</span>
          </div>
          <p style="color:#4A5A72; font-size:0.85rem; margin-top:8px;">
            Date Issued: ${fmtDate(issuedDate)}<br>
            Valid Through: ${fmtDate(expiresDate)}
          </p>
        </div>
        <div class="est-company-info">
          801-369-2330<br>
          info@renovosurface.com<br>
          renovosurface.com<br>
          30 N Orange Street, Salt Lake City, UT 84116
        </div>
      </div>

      <div class="prop-meta">
        <div class="prop-meta-block">
          <h4>Submitted To</h4>
          <p>
            <strong>${esc(client?.name)}</strong>${client?.company ? ` — ${esc(client.company)}` : ''}<br>
            ${client?.propertyAddress ? `${esc(client.propertyAddress)}<br>` : ''}
            ${client?.phone ? `${esc(client.phone)}<br>` : ''}
            ${esc(client?.email)}
          </p>
        </div>
        <div class="prop-meta-block">
          <h4>Project</h4>
          <p>
            <strong>${esc(estimate.projectName || 'Service Proposal')}</strong><br>
            ${estimate.siteAddress ? `${esc(estimate.siteAddress)}<br>` : (client?.propertyAddress ? `${esc(client.propertyAddress)}<br>` : '')}
            Proposal ${proposalNumber(estimate.id)}
            ${estimate.walkthroughDate ? `<br>Site walk completed ${fmtDate(new Date(estimate.walkthroughDate + 'T12:00:00'))}` : ''}
            ${government && government.solicitationNumber ? `<br>Solicitation ${esc(government.solicitationNumber)}` : ''}
          </p>
        </div>
      </div>

      ${summary && summary.length ? section('1.', 'Executive Summary', executiveSummaryHtml(summary)) : ''}
      ${section(nextNum(), 'Scope of Work', scopeBody)}
      ${schedule && schedule.hasAny ? section(nextNum(), 'Service Schedule', scheduleMatrixHtml(schedule)) : ''}
      ${sites && sites.length > 1 ? section(nextNum(), 'Property Breakdown', siteBreakdownHtml(sites, portfolioDiscountPct)) : ''}
      ${section(nextNum(), 'Pricing', pricingBody + contractValueHtml(contract))}
      ${government && government.multiYear && government.multiYear.hasOptionYears ? section(nextNum(), 'Contract Period Pricing', multiYearHtml(government.multiYear)) : ''}
      ${government ? section(nextNum(), 'Vendor Information &amp; Certifications', registrationHtml(government)) : ''}
      ${scope.exclusions.length ? section(nextNum(), 'Exclusions', `
        <p style="color:#4A5A72; font-size:0.86rem; margin-bottom:10px;">The following are not included in the pricing above. Any of them can be quoted separately on request.</p>
        ${bulletList(scope.exclusions, 'is-exclusion')}`) : ''}
      ${(scope.assumptions.length || estimate.siteConditions) ? section(nextNum(), 'Assumptions &amp; Site Conditions', `
        ${estimate.siteConditions ? `<p style="color:#374151; font-size:0.88rem; margin-bottom:10px; padding:10px 12px; background:var(--off-white); border-radius:6px;"><strong>Observed at walk-through:</strong> ${esc(estimate.siteConditions)}</p>` : ''}
        <p style="color:#4A5A72; font-size:0.86rem; margin-bottom:10px;">This price depends on the following being true on the service date. If any is not, we will document it and re-quote before proceeding.</p>
        ${bulletList(scope.assumptions)}`) : ''}
      ${photos && photos.length ? section(nextNum(), 'Site Photographs', photoSectionHtml(photos)) : ''}
      ${scope.compliance.length ? section(nextNum(), 'Insurance, Compliance &amp; Quality Assurance', `
        ${bulletList(scope.compliance, 'is-compliance')}
        <p style="color:#4A5A72; font-size:0.86rem; margin-top:10px;">If any work does not meet the scope above, contact us within 24 hours and we will return and re-do it at no charge.</p>`) : ''}

      ${section(nextNum(), 'Terms &amp; Acceptance', `
        <div class="prop-accept">
          <p style="color:#374151; font-size:0.88rem; line-height:1.7;">
            This proposal is valid through <strong>${fmtDate(expiresDate)}</strong>. Pricing is based on the scope, exclusions and assumptions stated above.
            Accepting this proposal authorizes Renovo Surface Solutions LLC to prepare a work order for the scope described.
            <strong>A signed work order is required before any work begins</strong> — acceptance here is not itself a work order.
            Payment terms, cancellation terms and the full service agreement are presented with the work order for signature.
          </p>
          ${estimate.notes ? `<p style="color:#4A5A72; font-size:0.88rem; margin-top:12px;"><strong>Notes:</strong> ${esc(estimate.notes)}</p>` : ''}
          <div class="prop-accept-grid">
            <div><div class="prop-sign-line"></div><div class="prop-sign-label">Authorized Signature</div></div>
            <div><div class="prop-sign-line"></div><div class="prop-sign-label">Date</div></div>
          </div>
          <div class="prop-accept-grid" style="margin-top:20px;">
            <div><div class="prop-sign-line"></div><div class="prop-sign-label">Print Name &amp; Title</div></div>
            <div><div class="prop-sign-line"></div><div class="prop-sign-label">PO / Reference</div></div>
          </div>
          <div class="prop-accept-grid" style="margin-top:26px; padding-top:18px; border-top:1px solid #EEF2F8;">
            <div><div class="prop-sign-line"></div><div class="prop-sign-label">For Renovo Surface Solutions LLC</div></div>
            <div><div class="prop-sign-line"></div><div class="prop-sign-label">Date</div></div>
          </div>
        </div>`)}

      <div class="print-btn-row no-print" style="margin-top:24px;">
        <button type="button" class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy);" onclick="window.print()">Print this proposal</button>
        <a class="btn btn-outline btn-sm" style="color:var(--navy); border-color:var(--navy); margin-left:8px; text-decoration:none;"
           href="/api/proposal/${token}/pdf">Download PDF</a>
      </div>

      ${actionsHtml}
    </div>
  `;
}

async function respond(action) {
  const res = await fetch(`/api/estimate/${token}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action })
  });
  if (res.ok) {
    load();
  } else {
    const data = await res.json().catch(() => ({}));
    const el = document.getElementById('respondError');
    if (el) {
      el.textContent = data.error || 'Something went wrong. Please call 801-369-2330.';
      el.classList.add('show');
    }
  }
}

load();
</script>
</body>
