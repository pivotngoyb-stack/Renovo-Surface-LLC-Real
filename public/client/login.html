<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login | Renovo Surface Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <div style="max-width:420px; margin:60px auto; padding:0 20px;">
    <div class="doc-card">
      <div style="text-align:center; margin-bottom:20px;">
        <img src="../images/logo.png" alt="Renovo Surface Solutions" style="height:48px;">
      </div>
      <h1 style="font-size:1.3rem; text-align:center; margin-bottom:8px;">Client Login</h1>
      <p style="color:#4A5A72; text-align:center; font-size:0.9rem; margin-bottom:24px;">Enter your email and we'll send you a secure login link — no password needed.</p>
      <div id="formArea">
        <div class="field-group"><label>Email</label><input type="email" id="email" placeholder="you@company.com"></div>
        <button class="btn btn-primary btn-block" id="submitBtn" onclick="requestLink()">Send Login Link</button>
        <p id="errorText" class="error-text" style="text-align:center;"></p>
      </div>
      <div id="sentArea" style="display:none; text-align:center;">
        <div class="icon" style="font-size:2.5rem;">📧</div>
        <p style="color:#4A5A72; margin-top:12px;">If that email is on file, we've sent a login link. Check your inbox — the link expires in 15 minutes.</p>
      </div>
    </div>
  </div>

<script>
async function requestLink() {
  const email = document.getElementById('email').value.trim();
  const errEl = document.getElementById('errorText');
  errEl.classList.remove('show');
  if (!email) { errEl.textContent = 'Please enter your email.'; errEl.classList.add('show'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    await fetch('/api/client/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
    });
    document.getElementById('formArea').style.display = 'none';
    document.getElementById('sentArea').style.display = 'block';
  } catch (err) {
    errEl.textContent = 'Something went wrong. Please try again.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Send Login Link';
  }
}
</script>
</body>
</html>
